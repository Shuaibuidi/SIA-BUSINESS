<style>
:root{font-family:Arial,sans-serif;color:#edf6ff;background:#071a2c}
*{box-sizing:border-box}
body{margin:0;padding:12px}
button,input,select,textarea{font:inherit}
.wrap{max-width:1100px;margin:auto}
.card{background:#102b43;border:1px solid #294c66;border-radius:14px;padding:15px;margin:12px 0}
h1,h2,h3{margin:4px 0 12px}
.muted{color:#a9bfd1;font-size:13px;line-height:1.5}
label{display:block;margin:9px 0 5px;color:#b9cee0;font-size:13px}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #3a5d77;background:#071a2c;color:white;font-size:16px}
textarea{min-height:75px}
button{border:0;border-radius:8px;padding:11px 14px;background:#1686d9;color:white;font-weight:bold;margin:4px 3px 4px 0}
button.secondary{background:#31516b}
button.danger{background:#a93636}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0}
.tabs button{white-space:nowrap}
.tabs button.active{background:#e39a28;color:#071a2c}
.item{padding:11px 0;border-bottom:1px solid #31516b;line-height:1.55}
.item:last-child{border:0}
.stat{font-size:22px;font-weight:bold}
.small{font-size:12px;color:#a9bfd1}
#msg,#status{white-space:pre-wrap;color:#ffd18b}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px;border-bottom:1px solid #31516b;vertical-align:top}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.actions button{padding:7px 10px;font-size:12px}
@media print{
 body{background:white;color:black}
 .no-print,#appHeader,#nav{display:none!important}
 .card{background:white;color:black;border:0}
 input,select,textarea{border:0;color:black}
}
</style>

function navItems(){

 ["dashboard","Dashboard"],
 ["stock","Stock"],
 ["spares","Spare parts"],
 ["sales","Sales"],
 ["jobs","Repairs / Jobs"],
 ["services","Services"],
 ["customers","Customers"],
 ["invoices","Invoices"]

 if(isAdmin())all.push(

 ["suppliers","Suppliers"],

function renderNav(){
 $("nav").innerHTML=navItems().map(([id,label])=>
 `<button class="${current===id?"active":""}" onclick="go('${id}')">${label}</button>`
 ).join("");
}

function go(id){

function formField(id,label,type="text",placeholder="",step=""){
 return `<div>
 <label>${label}</label>
 <input id="${id}" type="${type}" placeholder="${placeholder}" ${step?`step="${step}"`:""}>
 </div>`;
}

function selectField(id,label,opts){
 return `<div><label>${label}</label><select id="${id}">${opts}</select></div>`;
}

function val(id){return $(id)?.value?.trim()||""}
function num(id){return Number($(id)?.value||0)}

function safeId(s){
 return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||("item-"+Date.now());
}

async function addDoc(collection,data){
 return db.collection(path(collection)).add({
  ...data,
  createdAt:stamp(),
  createdBy:user.uid
 });
}

async function updateDoc(collection,id,data){
 return db.doc(`${path(collection)}/${id}`).update({
  ...data,
  updatedAt:stamp(),
  updatedBy:user.uid
 });
}

async function removeDoc(collection,id){
 if(!isAdmin())return alert("Admin permission required.");
 if(!confirm("Delete this record? This cannot be undone."))return;

 try{
  await db.doc(`${path(collection)}/${id}`).delete();
  say("Record deleted.");
 }catch(e){
  alert("Delete failed: "+e.message);
 }
}

function records(c){return cache[c]||[]}

function listHtml(c,render){
 return records(c).map(x=>`<div class="item">${render(x)}</div>`).join("")||
 `<p class="muted">No ${c} records yet.</p>`;
}

async function saveStock(){
 let name=val("stName");
 let quantity=num("stQty");
 let buyingPrice=num("stBuy");
 let sellingPrice=num("stSell");

 if(!name||!Number.isInteger(quantity)||quantity<0||buyingPrice<0||sellingPrice<0)
 return alert("Enter valid stock details.");

 let id=safeId(name);

 await db.doc(`${path("stock")}/${id}`).set({
  name,quantity,buyingPrice,sellingPrice,
  updatedAt:stamp(),
  updatedBy:user.uid
 },{merge:true});

 say("Stock item saved.");
 renderScreen();
}

async function editItem(c,id){
 if(!isAdmin())return alert("Admin only.");

 let x=records(c).find(v=>v.id===id);
 if(!x)return;

 let name=prompt("Name:",x.name);
 if(name===null)return;

 let quantity=Number(prompt("Quantity:",x.quantity));
 if(!Number.isInteger(quantity)||quantity<0)
 return alert("Invalid quantity.");

 let buy=Number(prompt("Buying price:",x.buyingPrice||0));
 if(buy<0||!Number.isFinite(buy))
 return alert("Invalid buying price.");

 let sell=Number(prompt("Selling price:",x.sellingPrice||0));
 if(sell<0||!Number.isFinite(sell))
 return alert("Invalid selling price.");

 await updateDoc(c,id,{
  name:name.trim(),
  quantity,
  buyingPrice:buy,
  sellingPrice:sell
 });

 say("Updated.");
 renderScreen();
}

async function sellItem(kind){
 let spare=kind==="spareParts";
 let id=val(spare?"saleSpare":"saleStock");
 let qty=num(spare?"spareQtySale":"saleQty");

 let item=records(kind).find(x=>x.id===id);

 if(!item||!Number.isInteger(qty)||qty<1)
 return alert("Choose an item and enter a valid quantity.");

 const collection=spare?"spareSales":"transactions";
 const ref=db.doc(`${path(kind)}/${id}`);
 const tx=db.collection(path(collection)).doc();

 try{
  await db.runTransaction(async t=>{
   let snap=await t.get(ref);

   if(!snap.exists||Number(snap.data().quantity)<qty)
   throw Error("Not enough stock available.");

   let d=snap.data();
   let total=qty*Number(d.sellingPrice||0);
   let cost=qty*Number(d.buyingPrice||0);

   t.update(ref,{
    quantity:Number(d.quantity)-qty,
    lastSaleTxId:tx.id,
    updatedAt:stamp(),
    updatedBy:user.uid
   });

   t.set(tx,{
    itemId:id,
    itemName:d.name,
    quantity:qty,
    unitPrice:Number(d.sellingPrice||0),
    unitCost:Number(d.buyingPrice||0),
    total,
    cost,
    profit:total-cost,
    customerName:val(spare?"spareCustomer":"saleCustomer")||"Walk-in",
    customerPhone:val(spare?"sparePhone":"salePhone"),
    workerUid:user.uid,
    workerName:member.name||user.email,
    type:spare?"spare_sale":"sale",
    createdAt:stamp()
   });
  });

  say("Sale recorded and stock quantity updated.");
  renderScreen();

 }catch(e){
  alert(e.message);
 }
}

async function purchase(c){
 let spare=c==="spareParts";
 let id=val(spare?"purSpare":"purStock");
 let qty=num(spare?"purSpQty":"purQty");
 let cost=num(spare?"purSpCost":"purCost");
 let supplier=val(spare?"purSpSupplier":"purSupplier");

 let item=records(c).find(x=>x.id===id);

 if(!item||!Number.isInteger(qty)||qty<1||cost<0)
 return alert("Enter valid purchase details.");

 let ref=db.doc(`${path(c)}/${id}`);

 await db.runTransaction(async t=>{
  let snap=await t.get(ref);
  if(!snap.exists)throw Error("Item not found.");

  t.update(ref,{
   quantity:Number(snap.data().quantity||0)+qty,
   buyingPrice:cost,
   updatedAt:stamp(),
   updatedBy:user.uid
  });
 });

 await addDoc("purchases",{
  itemId:id,
  itemName:item.name,
  category:c,
  quantity:qty,
  unitCost:cost,
  totalCost:qty*cost,
  supplier
 });

 say("Purchase saved and stock increased.");
 renderScreen();
}

const COLLECTIONS=[
 "stock","spareParts","transactions","spareSales",
 "jobs","services","customers","suppliers",
 "purchases","expenses","cashbook","invoices"
];

async function exportBackup(){
 try{
  let out={
   business:"S I A BUSINESS",
   exportedAt:new Date().toISOString(),
   data:{}
  };

  for(let c of COLLECTIONS){
   let snap=await db.collection(path(c)).get();
   out.data[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
  }

  let blob=new Blob([JSON.stringify(out,null,2)],{
   type:"application/json"
  });

  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");

  a.href=url;
  a.download="sia-business-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);

  say("Backup downloaded.");

 }catch(e){
  alert("Backup failed: "+e.message);
 }
}

async function restoreBackup(){
 if(!isAdmin())return alert("Admin only.");

 let file=$("restoreFile").files[0];
 if(!file)return alert("Choose a backup file.");

 if(!confirm("Restore records from this backup? Existing records with matching IDs will be overwritten."))
 return;

 try{
  let backup=JSON.parse(await file.text());

  if(!backup.data)throw Error("Invalid backup file.");

  for(let c of COLLECTIONS){
   for(let x of (backup.data[c]||[])){
    let {id,...data}=x;
    if(!id)continue;

    await db.doc(`${path(c)}/${id}`).set(data,{merge:true});
   }
  }

  alert("Backup restored.");
  say("Backup restored.");

 }catch(e){
  alert("Restore failed: "+e.message);
 }
}

function dateText(v){

  return v?.toDate?v.toDate().toLocaleString():
  v?new Date(v).toLocaleString():"";
 }catch(e){

 }
}

async function logout(){
 unsubs.forEach(f=>f());
 unsubs=[];
 await auth.signOut();
}

auth.onAuthStateChanged(async u=>{
 user=u;

 if(!u){
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  return;
 }

 try{
  let snap=await db.doc(`${path("members")}/${u.uid}`).get();

  if(!snap.exists||snap.data().active!==true){
   await auth.signOut();
   $("msg").textContent="This account is not authorized. Contact the Admin.";
   return;
  }

  member=snap.data();
  role=member.role;

  if(!["admin","worker"].includes(role))
  throw Error("Invalid account role.");

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  $("welcome").textContent="Welcome, "+(member.name||u.email);
  $("roleTag").textContent=role.toUpperCase()+" · "+u.email;

  startData();
  current="dashboard";
  renderNav();
  renderScreen();

 }catch(e){
  await auth.signOut();
  $("msg").textContent=e.message;
 }
});

function startData(){
 unsubs.forEach(f=>f());
 unsubs=[];

 const listen=(c,query=null)=>{
  let ref=db.collection(path(c));
  if(query)ref=query(ref);

  unsubs.push(ref.onSnapshot(s=>{
   cache[c]=s.docs.map(d=>({id:d.id,...d.data()}));

   if(c==="transactions"||c==="spareSales"){
    let total=
    records("transactions").reduce((a,x)=>a+Number(x.total||0),0)+
    records("spareSales").reduce((a,x)=>a+Number(x.total||0),0);

    if(isAdmin())$("salesTotal").textContent=money(total);
   }

   if([
    "dashboard","reports","sales","invoices","jobs",
    "services","stock","spares","customers","purchases",
    "suppliers","expenses","cashbook"
   ].includes(current)){
    renderScreen();
   }

  },e=>say(c+" loading error: "+e.message)));
 };

 ["stock","spareParts","customers"].forEach(c=>listen(c));

 if(isAdmin()){
  [
   "transactions","spareSales","jobs","services",
   "suppliers","purchases","expenses","cashbook","invoices"
  ].forEach(c=>listen(c));

 }else{
  listen("transactions",r=>r.where("workerUid","==",user.uid));
  listen("spareSales",r=>r.where("workerUid","==",user.uid));
  listen("jobs",r=>r.where("workerUid","==",user.uid));
  listen("services",r=>r.where("workerUid","==",user.uid));
  listen("invoices",r=>r.where("createdBy","==",user.uid));
 }
}

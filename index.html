<!doctype html>
<html lang="en">
<head>

<style>
:root{font-family:Arial,sans-serif;color:#edf6ff;background:#071a2c}
*{box-sizing:border-box}body{margin:0;padding:12px}button,input,select,textarea{font:inherit}
.wrap{max-width:1100px;margin:auto}.card{background:#102b43;border:1px solid #294c66;border-radius:14px;padding:15px;margin:12px 0}
h1,h2,h3{margin:4px 0 12px}.muted{color:#a9bfd1;font-size:13px;line-height:1.5}
label{display:block;margin:9px 0 5px;color:#b9cee0;font-size:13px}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #3a5d77;background:#071a2c;color:white;font-size:16px}
textarea{min-height:75px}button{border:0;border-radius:8px;padding:11px 14px;background:#1686d9;color:white;font-weight:bold;margin:4px 3px 4px 0}
button.secondary{background:#31516b}button.danger{background:#a93636}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}
.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#e39a28;color:#071a2c}
.item{padding:13px;margin:9px 0;border:1px solid #31516b;border-radius:12px;background:linear-gradient(135deg,#102b43,#0b2237);line-height:1.6;box-shadow:0 3px 10px #0002}
.item strong,.item b{color:#fff}.item .muted{display:block;margin-top:3px}
.stat{font-size:22px;font-weight:bold}.small{font-size:12px;color:#a9bfd1}#msg,#status{white-space:pre-wrap;color:#ffd18b}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #31516b;vertical-align:top}
.actions{display:flex;gap:4px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}
.service-catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}
.service-chip{background:#0a2033;border:1px solid #365a75;border-radius:10px;padding:10px;color:#dceeff;font-size:13px}
@media print{body{background:white;color:black}.no-print,#appHeader,#nav{display:none!important}.card{background:white;color:black;border:0}input,select,textarea{border:0;color:black}}
.invoice-overlay{position:fixed;inset:0;z-index:9999;background:#071a2c;overflow:auto;padding:14px;display:none}
.invoice-paper{max-width:760px;margin:10px auto;background:#fff;color:#111;padding:24px;border-radius:10px}
.invoice-paper h1{text-align:center;color:#111}
.invoice-paper table{color:#111}
.invoice-controls{max-width:760px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
@media print{
 body{padding:0!important;background:#fff!important}
 body>*{visibility:hidden!important}
 #invoicePreview,#invoicePreview *{visibility:visible!important}
 #invoicePreview{display:block!important;position:absolute;inset:0;background:#fff;padding:0;margin:0;overflow:visible}
 .invoice-controls{display:none!important}
 .invoice-paper{max-width:none;margin:0;padding:12mm;border-radius:0}
}
</style>

<body><div class="wrap">

<div class="muted">Matindi Trading Centre, Blantyre · Malawi</div>
<div class="muted">0999 290 495 · 0888 290 495</div></div>

<section id="app" class="hidden"><div class="card row"><div><h2 id="welcome">Welcome</h2><span id="roleTag" class="muted"></span></div><div><div class="stat" id="salesTotal">MK 0</div><div class="small">Sales recorded (admin view)</div></div></div><nav id="nav" class="tabs no-print"></nav><main id="screen"></main><div id="status" class="muted"></div></section>
</div>

 <div class="invoice-controls no-print">
  <button type="button" onclick="printCurrentInvoice()">Print Invoice</button>
  <button type="button" class="secondary" onclick="closeInvoicePreview()">Back To App</button>
 </div>
 <div id="invoicePaper" class="invoice-paper"></div>
</section>
<script>
const firebaseConfig={apiKey:"AIzaSyAf8Sg2eDDQtKTXPT913E32IUUdLvIde-I",authDomain:"smart-business-manager-f319f.firebaseapp.com",projectId:"smart-business-manager-f319f",storageBucket:"smart-business-manager-f319f.firebasestorage.app",messagingSenderId:"716400037263",appId:"1:716400037263:web:42a1e961b1597d0d280ffa"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),BUSINESS_ID="7RqIYO3IDSVCYex1LsDo6rDw5V33";
const COLLECTIONS=["stock","spareParts","transactions","spareSales","jobs","services","customers","suppliers","purchases","expenses","cashbook","invoices"];
let user=null,member=null,role=null,current="dashboard",cache={},unsubs=[];
const $=id=>document.getElementById(id),path=c=>`businesses/${BUSINESS_ID}/${c}`,isAdmin=()=>role==="admin",money=n=>"MK "+Number(n||0).toLocaleString("en-MW",{maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),stamp=()=>firebase.firestore.FieldValue.serverTimestamp(),val=id=>$(id)?.value?.trim()||"",num=id=>Number($(id)?.value||0),records=c=>cache[c]||[];
function invoiceRecorder(){return isAdmin()?"Managing Director":(String(member?.name||user?.email||"Worker").trim())}
function say(t){$("status").textContent=t||""}function safeId(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||("item-"+Date.now())}
function dateText(v){try{return v?.toDate?v.toDate().toLocaleString():v?new Date(v).toLocaleString():""}catch(e){return ""}}
function navItems(){let a=[["dashboard","Dashboard"],["stock","Stock"],["spares","Spare parts"],["sales","Sales"],["jobs","Repairs / Jobs"],["services","Printing Services"],["customers","Customers"],["invoices","Invoices"],["settings","Account Information"]];if(isAdmin())a.push(["workers","Workers"],["purchases","Purchases"],["suppliers","Suppliers"],["expenses","Expenses"],["cashbook","Cashbook"],["reports","Reports"]);return a}
function renderNav(){$("nav").innerHTML=navItems().map(([id,label])=>`<button class="${current===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("")}
function go(id){current=id;renderNav();renderScreen();say("")}
function formField(id,label,type="text",placeholder="",step=""){return `<div><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${step?`step="${step}"`:""}></div>`}
function selectField(id,label,opts){return `<div><label>${label}</label><select id="${id}">${opts}</select></div>`}
async function addDoc(c,data){return db.collection(path(c)).add({...data,createdAt:stamp(),createdBy:user.uid})}
async function updateDoc(c,id,data){return db.doc(`${path(c)}/${id}`).update({...data,updatedAt:stamp(),updatedBy:user.uid})}
async function removeDoc(c,id){if(!isAdmin())return alert("Admin permission required.");if(!confirm("Delete this record permanently?"))return;try{await db.doc(`${path(c)}/${id}`).delete();say("Record deleted.")}catch(e){alert("Delete failed: "+e.message)}}
function listHtml(c,render){return records(c).map(x=>`<div class="item">${render(x)}</div>`).join("")||`<p class="muted">No ${c} records yet.</p>`}
function adminDelete(c,x){return isAdmin()?`<div class="actions"><button class="danger" onclick="removeDoc('${c}','${x.id}')">Delete</button></div>`:""}
function renderScreen(){let s=$("screen");if(!s)return;let f={dashboard,stock:stockScreen,spares:spareScreen,sales:salesScreen,jobs:jobsScreen,services:servicesScreen,customers:customersScreen,invoices:invoicesScreen,workers:workersScreen,purchases:purchasesScreen,suppliers:suppliersScreen,expenses:expensesScreen,cashbook:cashbookScreen,reports:reportsScreen,settings:settingsScreen};(f[current]||dashboard)(s)}

function dashboard(s){let tx=[...records("transactions"),...records("spareSales")],sales=tx.reduce((a,x)=>a+Number(x.total||0),0)+records("services").reduce((a,x)=>a+Number(x.amount||0),0),exp=records("expenses").reduce((a,x)=>a+Number(x.amount||0),0),low=[...records("stock"),...records("spareParts")].filter(x=>Number(x.quantity||0)<=Number(x.lowStockAt??5));s.innerHTML=`<div class="grid"><div class="card"><div class="muted">Sales / services</div><div class="stat">${money(isAdmin()?sales:tx.filter(x=>x.workerUid===user.uid).reduce((a,x)=>a+Number(x.total||0),0))}</div></div><div class="card"><div class="muted">Stock items</div><div class="stat">${records("stock").length}</div></div><div class="card"><div class="muted">Spare parts</div><div class="stat">${records("spareParts").length}</div></div><div class="card"><div class="muted">Repair jobs</div><div class="stat">${records("jobs").length}</div></div>${isAdmin()?`<div class="card"><div class="muted">Expenses</div><div class="stat">${money(exp)}</div></div><div class="card"><div class="muted">Estimated gross profit</div><div class="stat">${money(grossProfit())}</div></div><div class="card"><div class="muted">Low-stock alerts</div><div class="stat">${low.length}</div></div><div class="card"><div class="muted">Customer balances</div><div class="stat">${money(records("invoices").reduce((a,x)=>a+Math.max(0,Number(x.balance||0)),0))}</div></div>`:""}</div>${isAdmin()?`<div class="card"><h3>Low-stock alerts</h3>${low.map(x=>`<div class="item"><b>${esc(x.name)}</b> · Available: ${Number(x.quantity||0)} · Alert level: ${Number(x.lowStockAt??5)}</div>`).join("")||`<p class="muted">No items at or below their alert level.</p>`}</div>`:""}<div class="card"><h3>Welcome to S I A BUSINESS</h3><p class="muted">Manage stock, spare parts, sales, repairs and printing services from one place.</p></div>`}

function stockScreen(s){s.innerHTML=`${isAdmin()?`<div class="card"><h3>Stock management</h3><div class="grid">${formField("stName","Product name")}${formField("stQty","Quantity","number")}${formField("stLow","Low-stock alert at","number")}${formField("stBuy","Buying price (MK)","number","","0.01")}${formField("stSell","Selling price (MK)","number","","0.01")}</div><button onclick="saveStock()">Save stock item</button></div>`:""}<div class="card"><h3>Stock list</h3>${listHtml("stock",p=>`<b>📦 ${esc(p.name)}</b><br><span class="muted">Available quantity: ${p.quantity} · Low-stock alert: ${Number(p.lowStockAt??5)}</span><br>${Number(p.quantity||0)<=Number(p.lowStockAt??5)?`<b style="color:#ffd18b">LOW STOCK</b><br>`:""}<b>Selling price: ${money(p.sellingPrice)}</b>${isAdmin()?`<br>Buying: ${money(p.buyingPrice)} · Profit/unit: ${money(Number(p.sellingPrice)-Number(p.buyingPrice))}<div class="actions"><button onclick="editItem('stock','${p.id}')">Edit</button><button class="danger" onclick="removeDoc('stock','${p.id}')">Delete</button></div>`:""}`)}</div>`}

async function saveStock(){if(!isAdmin())return alert("Admin permission required.");let name=val("stName"),quantity=num("stQty"),lowStockAt=val("stLow")===""?5:num("stLow"),buyingPrice=num("stBuy"),sellingPrice=num("stSell");if(!name||!Number.isInteger(quantity)||quantity<0||!Number.isInteger(lowStockAt)||lowStockAt<0||buyingPrice<0||sellingPrice<0)return alert("Enter valid stock details.");try{await db.doc(`${path("stock")}/${safeId(name)}`).set({name,quantity,lowStockAt,buyingPrice,sellingPrice,createdAt:stamp(),createdBy:user.uid,updatedAt:stamp(),updatedBy:user.uid},{merge:true});say("Stock item saved.");renderScreen()}catch(e){alert("Could not save stock: "+e.message)}}

async function editItem(c,id){if(!isAdmin())return alert("Admin only.");let x=records(c).find(v=>v.id===id);if(!x)return;let name=prompt("Name:",x.name);if(name===null)return;let q=Number(prompt("Quantity:",x.quantity)),b=Number(prompt("Buying price:",x.buyingPrice||0)),p=Number(prompt("Selling price:",x.sellingPrice||0));if(!name.trim()||!Number.isInteger(q)||q<0||!Number.isFinite(b)||b<0||!Number.isFinite(p)||p<0)return alert("Invalid details.");try{await updateDoc(c,id,{name:name.trim(),quantity:q,buyingPrice:b,sellingPrice:p});say("Item updated.");renderScreen()}catch(e){alert("Update failed: "+e.message)}}

function spareScreen(s){s.innerHTML=`${isAdmin()?`<div class="card"><h3>Spare parts management</h3><div class="grid">${formField("spName","Spare part name")}${formField("spQty","Quantity","number")}${formField("spLow","Low-stock alert at","number")}${formField("spBuy","Buying price (MK)","number","","0.01")}${formField("spSell","Selling price (MK)","number","","0.01")}</div><button onclick="saveSpare()">Save spare part</button></div>`:""}<div class="card"><h3>Spare parts list</h3>${listHtml("spareParts",p=>`<b>🔧 ${esc(p.name)}</b><br>Qty: ${p.quantity} · ${Number(p.quantity||0)<=Number(p.lowStockAt??5)?`<b style="color:#ffd18b">LOW STOCK</b> · `:""}Selling: ${money(p.sellingPrice)}${isAdmin()?`<br>Buy: ${money(p.buyingPrice)} · Profit/unit: ${money(p.sellingPrice-p.buyingPrice)} · Potential profit: ${money((p.sellingPrice-p.buyingPrice)*p.quantity)}<div class="actions"><button onclick="editItem('spareParts','${p.id}')">Edit</button><button class="danger" onclick="removeDoc('spareParts','${p.id}')">Delete</button></div>`:""}`)}</div>`}

async function saveSpare(){if(!isAdmin())return alert("Admin permission required.");let name=val("spName"),quantity=num("spQty"),lowStockAt=val("spLow")===""?5:num("spLow"),buyingPrice=num("spBuy"),sellingPrice=num("spSell");if(!name||!Number.isInteger(quantity)||quantity<0||!Number.isInteger(lowStockAt)||lowStockAt<0||buyingPrice<0||sellingPrice<0)return alert("Enter valid spare part details.");try{await db.doc(`${path("spareParts")}/${safeId(name)}`).set({name,quantity,lowStockAt,buyingPrice,sellingPrice,createdAt:stamp(),createdBy:user.uid,updatedAt:stamp(),updatedBy:user.uid},{merge:true});say("Spare part saved.");renderScreen()}catch(e){alert("Could not save spare part: "+e.message)}}

function salesScreen(s){let so=records("stock").map(x=>`<option value="${x.id}">${esc(x.name)} (${x.quantity} available)</option>`).join(""),po=records("spareParts").map(x=>`<option value="${x.id}">${esc(x.name)} (${x.quantity} available)</option>`).join("");s.innerHTML=`<div class="card"><h3>Record stock sale</h3><div class="grid">${selectField("saleStock","Stock item",so)}${formField("saleQty","Quantity","number")}${formField("saleCustomer","Customer name")}${formField("salePhone","Customer phone")}${formField("salePaid","Amount paid (MK)","number","","0.01")}</div><button onclick="sellItem('stock')">Record stock sale</button></div><div class="card"><h3>Record spare part sale</h3><div class="grid">${selectField("saleSpare","Spare part",po)}${formField("spareQtySale","Quantity","number")}${formField("spareCustomer","Customer name")}${formField("sparePhone","Customer phone")}${formField("sparePaid","Amount paid (MK)","number","","0.01")}</div><button onclick="sellItem('spareParts')">Record spare part sale</button></div><div class="card"><h3>Sales history</h3><h3>Stock sales</h3>${listHtml("transactions",x=>`<b>🧾 ${esc(x.itemName)}</b> × ${x.quantity} = <b>${money(x.total)}</b><br><span class="muted">${esc(x.customerName||"Walk-in")} · ${esc(x.workerName||"")} · ${dateText(x.createdAt)}</span>${isAdmin()?`<br>Profit: ${money(x.profit||0)}${adminDelete("transactions",x)}`:""}`)}<h3>Spare part sales</h3>${listHtml("spareSales",x=>`<b>🧾 ${esc(x.itemName)}</b> × ${x.quantity} = <b>${money(x.total)}</b><br><span class="muted">${esc(x.customerName||"Walk-in")} · ${esc(x.workerName||"")} · ${dateText(x.createdAt)}</span>${isAdmin()?`<br>Profit: ${money(x.profit||0)}${adminDelete("spareSales",x)}`:""}`)}</div>`}

async function sellItem(kind){let spare=kind==="spareParts",id=val(spare?"saleSpare":"saleStock"),qty=num(spare?"spareQtySale":"saleQty"),item=records(kind).find(x=>x.id===id),paidRaw=val(spare?"sparePaid":"salePaid"),paid=paidRaw===""?null:Number(paidRaw);if(!item||!Number.isInteger(qty)||qty<1||(paid!==null&&(!Number.isFinite(paid)||paid<0)))return alert("Choose an item, enter a valid quantity and a non-negative payment.");let col=spare?"spareSales":"transactions",ref=db.doc(`${path(kind)}/${id}`),tx=db.collection(path(col)).doc(),customerName=val(spare?"spareCustomer":"saleCustomer")||"Walk-in",phone=val(spare?"sparePhone":"salePhone");try{let saleData;await db.runTransaction(async t=>{let snap=await t.get(ref);if(!snap.exists||Number(snap.data().quantity)<qty)throw Error("Not enough stock available.");let d=snap.data(),total=qty*Number(d.sellingPrice||0),cost=qty*Number(d.buyingPrice||0);if(paid!==null&&paid>total)throw Error("Amount paid cannot exceed the sale total.");saleData={invoiceNo:"SIA-"+Date.now().toString().slice(-8),customerName,phone,description:`${d.name} × ${qty}`,quantity:qty,unitPrice:Number(d.sellingPrice||0),total,paid:paid===null?total:paid,balance:total-(paid===null?total:paid),sourceType:spare?"spare_sale":"sale",sourceId:tx.id,recordedBy:invoiceRecorder(),recordedByUid:user.uid};t.update(ref,{quantity:Number(d.quantity)-qty,lastSaleTxId:tx.id,updatedAt:stamp(),updatedBy:user.uid});t.set(tx,{itemId:id,itemName:d.name,quantity:qty,unitPrice:Number(d.sellingPrice||0),unitCost:Number(d.buyingPrice||0),total,cost,profit:total-cost,customerName,customerPhone:phone,workerUid:user.uid,workerName:member.name||user.email,type:spare?"spare_sale":"sale",createdAt:stamp()})});let invRef=await addDoc("invoices",saleData);saleData.id=invRef.id;saleData.createdAt=new Date();say("Sale recorded, stock updated and invoice generated.");showInvoice(saleData);renderScreen()}catch(e){alert("Sale failed: "+e.message)}}

function jobsScreen(s){s.innerHTML=`<div class="card"><h3>New repair / technician job</h3><div class="grid">${formField("jobCustomer","Customer name")}${formField("jobPhone","Customer phone")}${formField("jobDevice","Device / item")}${formField("jobIssue","Problem / work required")}${formField("jobFee","Service charge (MK)","number","","0.01")}${formField("jobParts","Parts cost (MK)","number","","0.01")}${formField("jobPaid","Amount paid (MK)","number","","0.01")}</div><label>Job notes</label><textarea id="jobNotes"></textarea><button onclick="saveJob()">Save job & invoice</button></div><div class="card"><h3>Repair jobs</h3>${listHtml("jobs",j=>`<b>🛠️ ${esc(j.device)}</b> · ${esc(j.customerName)}<br>${esc(j.issue)}<br>Charge: ${money(j.fee)} · Parts: ${money(j.partsCost)} · Status: <b>${esc(j.status)}</b><br><span class="muted">Technician: ${esc(j.workerName||"")}</span><div class="actions"><button onclick="changeJob('${j.id}')">Update status</button>${adminDelete("jobs",j)}</div>`)}</div>`}

async function saveJob(){let d={customerName:val("jobCustomer"),customerPhone:val("jobPhone"),device:val("jobDevice"),issue:val("jobIssue"),fee:num("jobFee"),partsCost:num("jobParts"),notes:val("jobNotes"),status:"Received",workerUid:user.uid,workerName:member.name||user.email};let paidJob=val("jobPaid")===""?d.fee:num("jobPaid");if(!d.customerName||!d.device||!d.issue||!Number.isFinite(d.fee)||d.fee<0||!Number.isFinite(d.partsCost)||d.partsCost<0||!Number.isFinite(paidJob)||paidJob<0||paidJob>d.fee)return alert("Complete valid job details. Payment must be between zero and the service charge.");try{let j=await addDoc("jobs",d);let inv={invoiceNo:"SIA-"+Date.now().toString().slice(-8),customerName:d.customerName,phone:d.customerPhone,description:`Repair: ${d.device} — ${d.issue}`,quantity:1,unitPrice:d.fee,total:d.fee,paid:paidJob,balance:d.fee-paidJob,sourceType:"repair",sourceId:j.id,recordedBy:invoiceRecorder(),recordedByUid:user.uid};let ir=await addDoc("invoices",inv);inv.id=ir.id;inv.createdAt=new Date();say("Repair job saved and invoice generated.");showInvoice(inv);renderScreen()}catch(e){alert("Job save failed: "+e.message)}}

async function changeJob(id){let j=records("jobs").find(x=>x.id===id);if(!j)return;let status=prompt("Enter status: Received, Diagnosing, Waiting for parts, In progress, Completed, Collected",j.status);if(!status)return;try{await updateDoc("jobs",id,{status});say("Job status updated.");renderScreen()}catch(e){alert("Status update failed: "+e.message)}}

async function savePurchase(){
if(!isAdmin())return alert("Admin permission required.");
let category=val("purchaseType"),
name=val("purchaseName"),
quantity=num("purchaseQty"),
unitCost=num("purchaseCost"),
supplier=val("purchaseSupplier"),
reference=val("purchaseReference");

if(!name||!Number.isInteger(quantity)||quantity<1||
!Number.isFinite(unitCost)||unitCost<0){
return alert("Enter valid purchase details.");
}

let collection=category==="spareParts"?"spareParts":"stock";
let itemId=safeId(name);
let ref=db.doc(`${path(collection)}/${itemId}`);
let totalCost=quantity*unitCost;

try{
await db.runTransaction(async t=>{
let snap=await t.get(ref);
if(snap.exists){
let old=snap.data();
let oldQty=Number(old.quantity||0);
let oldCost=Number(old.buyingPrice||0);
let newQty=oldQty+quantity;
let averageCost=((oldQty*oldCost)+(quantity*unitCost))/newQty;
t.update(ref,{
quantity:newQty,
buyingPrice:averageCost,
updatedAt:stamp(),
updatedBy:user.uid
});
}else{
t.set(ref,{
name,
quantity,
lowStockAt:5,
buyingPrice:unitCost,
sellingPrice:unitCost,
createdAt:stamp(),
createdBy:user.uid,
updatedAt:stamp(),
updatedBy:user.uid
});
}
});

await addDoc("purchases",{
itemName:name,
category,
quantity,
unitCost,
totalCost,
supplier,
reference
});

// Purchases are recorded in the Purchases ledger and stock value.
      // They are not operating expenses; cost of goods is reflected when items sell.

say("Purchase recorded and stock quantity updated.");
renderScreen();
}catch(e){alert("Purchase failed: "+e.message)}
}

async function recordPayment(id){
let x=records("invoices").find(v=>v.id===id);
if(!x)return alert("Invoice not found.");
let balance=Math.max(0,Number(x.balance||0));
if(balance<=0)return alert("This invoice is already fully paid.");
let amount=Number(prompt("Enter payment received (MK). Outstanding balance: "+money(balance)));
if(!Number.isFinite(amount)||amount<=0||amount>balance){
return alert("Enter a payment greater than zero and not more than the outstanding balance.");
}
try{
let ref=db.doc(`${path("invoices")}/${id}`);
await db.runTransaction(async t=>{
let snap=await t.get(ref);
if(!snap.exists)throw Error("Invoice not found.");
let currentBalance=Number(snap.data().balance||0);
if(amount>currentBalance)throw Error("The balance has changed. Please try again.");
let newPaid=Number(snap.data().paid||0)+amount;
let newBalance=currentBalance-amount;
let history=Array.isArray(snap.data().paymentHistory)?snap.data().paymentHistory:[];
history.push({
amount,
date:new Date().toISOString(),
receivedBy:user.uid,
receivedByName:member.name||user.email
});
t.update(ref,{
paid:newPaid,
balance:newBalance,
paymentHistory:history,
updatedAt:stamp(),
updatedBy:user.uid
});
});
say("Payment recorded successfully.");
renderScreen();
}catch(e){alert("Payment failed: "+e.message)}
}

function grossProfit(){
let sales=records("transactions").reduce((a,x)=>a+Number(x.profit||0),0);
let spares=records("spareSales").reduce((a,x)=>a+Number(x.profit||0),0);
let services=records("services").reduce((a,x)=>a+Number(x.amount||0)-Number(x.cost||0),0);
let repairs=records("jobs").reduce((a,x)=>a+Number(x.fee||0)-Number(x.partsCost||0),0);
return sales+spares+services+repairs;
}

function exportReport(){
if(!isAdmin())return alert("Admin permission required.");
let rows=[
["Category","Description","Quantity","Cost","Selling / Total","Profit"],
...records("transactions").map(x=>["Stock Sale",x.itemName,x.quantity,x.cost,x.total,x.profit]),
...records("spareSales").map(x=>["Spare Sale",x.itemName,x.quantity,x.cost,x.total,x.profit]),
...records("services").map(x=>["Printing Service",x.serviceType,x.quantity,x.cost,x.amount,Number(x.amount||0)-Number(x.cost||0)]),
...records("jobs").map(x=>["Repair",x.device,1,x.partsCost,x.fee,Number(x.fee||0)-Number(x.partsCost||0)]),
...records("expenses").map(x=>["Expense",x.description,"",x.amount,"",""])
];
let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");

function backupEncode(value){
  if(value && typeof value.toDate==="function" && typeof value.seconds==="number"){
    return {__siaType:"timestamp",seconds:value.seconds,nanoseconds:value.nanoseconds||0};
  }
  if(Array.isArray(value))return value.map(backupEncode);
  if(value&&typeof value==="object"){
    let out={};
    for(let [k,v] of Object.entries(value))out[k]=backupEncode(v);
    return out;
  }
  return value;
}
function backupDecode(value){
  if(Array.isArray(value))return value.map(backupDecode);
  if(value&&typeof value==="object"){
    if(value.__siaType==="timestamp"&&Number.isFinite(value.seconds)){
      return new firebase.firestore.Timestamp(value.seconds,Number(value.nanoseconds||0));
    }
    let out={};
    for(let [k,v] of Object.entries(value))out[k]=backupDecode(v);
    return out;
  }
  return value;
}
async function driveAccessToken(){
  if(!window.SIAGoogleDriveAuth||typeof window.SIAGoogleDriveAuth.getAccessToken!=="function"){
    throw new Error("Google Drive sign-in is not available in this APK. Build and install the latest APK first.");
  }
  return window.SIAGoogleDriveAuth.getAccessToken();
}
async function driveRequest(url,token,options={}){
  let response=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:"Bearer "+token}});
  if(!response.ok){
    let detail="";
    try{let j=await response.json();detail=j.error?.message||JSON.stringify(j)}catch(e){try{detail=await response.text()}catch(x){}}
    throw new Error("Google Drive error ("+response.status+"): "+(detail||response.statusText));
  }
  return response;
}
async function backupToGoogleDrive(button,options={}){
  const automatic=options.automatic===true;
  if(!isAdmin())return automatic?false:alert("Admin permission required.");
  if(button){button.disabled=true;button.textContent="Preparing Backup...";}
  try{
    say(automatic?"Daily automatic backup: reading business records...":"Reading business records for backup...");
    let names=[...COLLECTIONS],exported={},denied=[];
    for(let c of names){
      try{
        let snap=await db.collection(path(c)).get();
        exported[c]=snap.docs.map(d=>({id:d.id,data:backupEncode(d.data())}));
      }catch(e){
        denied.push({collection:c,error:e.code||e.message||"Read denied"});
        exported[c]=null;
      }
    }
    let readable=Object.keys(exported).filter(c=>Array.isArray(exported[c]));
    if(!readable.length)throw new Error("Firestore did not allow reading any business collections. No backup file was created.");
    let backup={
      app:"SIA BUSINESS",
      formatVersion:1,
      businessId:BUSINESS_ID,
      exportedAt:new Date().toISOString(),
      backupType:denied.length?"PARTIAL":"COMPLETE",
      collections:exported,
      inaccessibleCollections:denied
    };
    let token=await driveAccessToken();
    let stampName=new Date().toISOString().replace(/[:.]/g,"-");
    let filename="SIA-Business-Backup-"+stampName+".json";
    let boundary="sia_backup_"+Date.now();
    let metadata={name:filename,mimeType:"application/json",description:"S I A BUSINESS Firestore backup. "+(denied.length?"Partial backup":"Complete backup")};
    let body="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+"\r\n--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(backup)+"\r\n--"+boundary+"--";
    let response=await driveRequest("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,createdTime",token,{
      method:"POST",
      headers:{"Content-Type":"multipart/related; boundary="+boundary},
      body
    });
    let file=await response.json();
    let count=readable.reduce((n,c)=>n+exported[c].length,0);
    let message=(denied.length?"PARTIAL BACKUP SAVED":"BACKUP SAVED")+" to Google Drive. "+count+" records from "+readable.length+" collections. "+(denied.length?"Blocked collections: "+denied.map(x=>x.collection).join(", ")+".":"All app collections were readable.");
    if(automatic){
      const day=localBackupDay();
      localStorage.setItem("sia_business_last_auto_backup_"+user.uid,day);
      say("Daily automatic backup completed. "+count+" records saved to Google Drive.");
    }else{
      say(message);
      alert(message);
    }
    return true;
  }catch(e){
    console.error(e);
    const failure="Backup failed: "+e.message;
    say(automatic?"Daily automatic backup could not complete: "+e.message:failure);
    if(!automatic)alert(failure);
    return false;
  }finally{
    if(button){button.disabled=false;button.textContent="Back Up Business Records To Google Drive";}
  }
}
async function restoreLatestFromGoogleDrive(button){
  if(!isAdmin())return alert("Admin permission required.");
  if(!confirm("Restore the latest S I A BUSINESS backup? Existing records will NEVER be overwritten. Only missing records that Firestore rules allow will be added."))return;
  if(button){button.disabled=true;button.textContent="Checking Google Drive...";}
  try{
    let token=await driveAccessToken();
    let q=encodeURIComponent("trashed=false and name contains 'SIA-Business-Backup-'");
    let listResponse=await driveRequest("https://www.googleapis.com/drive/v3/files?q="+q+"&pageSize=20&orderBy=createdTime desc&fields=files(id,name,createdTime)",token);
    let files=(await listResponse.json()).files||[];
    if(!files.length)throw new Error("No S I A BUSINESS backup file was found in the Google account you connected.");
    let chosen=files[0];
    if(!confirm("Use this backup?\n"+chosen.name+"\n\nThe restore adds missing records only. It does not replace or delete existing records."))return;
    say("Downloading backup "+chosen.name+"...");
    let download=await driveRequest("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(chosen.id)+"?alt=media",token);
    let backup=await download.json();
    if(backup.app!=="SIA BUSINESS"||backup.businessId!==BUSINESS_ID||!backup.collections||typeof backup.collections!=="object"){
      throw new Error("This file is not a valid backup for this S I A BUSINESS account.");
    }
    let added=0,existing=0,blocked=[],invalid=0;
    for(let c of COLLECTIONS){
      let docs=backup.collections[c];
      if(!Array.isArray(docs))continue;
      for(let item of docs){
        if(!item||typeof item.id!=="string"||!item.id||!item.data||typeof item.data!=="object"){invalid++;continue;}
        try{
          let ref=db.doc(path(c)+"/"+item.id);
          let currentDoc=await ref.get();
          if(currentDoc.exists){existing++;continue;}
          await ref.set(backupDecode(item.data));
          added++;
        }catch(e){
          blocked.push(c);
        }
      }
    }
    let uniqueBlocked=[...new Set(blocked)];
    let message="Restore finished. Added "+added+" missing records. Left "+existing+" existing records unchanged. "+(uniqueBlocked.length?"Firestore blocked writes in: "+uniqueBlocked.join(", ")+". ":"")+(invalid?"Skipped "+invalid+" invalid entries.":"");
    say(message);
    alert(message);
  }catch(e){
    console.error(e);
    say("Restore failed: "+e.message);
    alert("Restore failed: "+e.message);
  }finally{
    if(button){button.disabled=false;button.textContent="Restore Latest Backup (Add Missing Records Only)";}
  }
}

const AUTO_BACKUP_ENABLED_KEY="sia_business_daily_auto_backup_enabled";
let autoBackupRunning=false;
function localBackupDay(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dailyAutoBackupEnabled(){
  return localStorage.getItem(AUTO_BACKUP_ENABLED_KEY)!=="false";
}
function toggleDailyAutoBackup(){
  localStorage.setItem(AUTO_BACKUP_ENABLED_KEY,dailyAutoBackupEnabled()?"false":"true");
  renderScreen();
}
async function maybeRunDailyAutoBackup(){
  if(!user||!isAdmin()||!dailyAutoBackupEnabled()||autoBackupRunning)return;
  const day=localBackupDay();
  const last=localStorage.getItem("sia_business_last_auto_backup_"+user.uid);
  if(last===day)return;
  autoBackupRunning=true;
  try{
    await backupToGoogleDrive(null,{automatic:true});
  }finally{
    autoBackupRunning=false;
  }
}

function clearListeners(){
unsubs.forEach(fn=>{try{fn()}catch(e){}});
unsubs=[];
}

function listen(collection,query){
let ref=db.collection(path(collection));
if(query)ref=query(ref);
let unsub=ref.onSnapshot(snapshot=>{
cache[collection]=snapshot.docs.map(d=>({id:d.id,...d.data()}));
if(current==="dashboard"||current==="reports"||current==="invoices"||current==="workers"||current==="stock"||current==="spares"||current==="sales"||current==="jobs"||current==="services"||current==="customers"||current==="suppliers"||current==="purchases"||current==="expenses"||current==="cashbook"){
renderScreen();
}
if($("salesTotal")){
let total=records("transactions").reduce((a,x)=>a+Number(x.total||0),0);
total+=records("spareSales").reduce((a,x)=>a+Number(x.total||0),0);
$("salesTotal").textContent=money(total);
}
},error=>{
say("Unable to load "+collection+": "+error.message);
});
unsubs.push(unsub);
}

async function startData(){
clearListeners();
cache={};
try{
let memberRef=db.doc(`${path("members")}/${user.uid}`);
let memberSnap=await memberRef.get();
if(!memberSnap.exists){
await auth.signOut();
$("msg").textContent="Your account is not registered as a business member. Contact the Admin.";
return;
}
member=memberSnap.data();
if(member.active===false){
await auth.signOut();
$("msg").textContent="Your account is inactive. Contact the Admin.";
return;
}
role=member.role||"worker";
$("login").classList.add("hidden");
$("app").classList.remove("hidden");
$("logoutBtn").classList.remove("hidden");
$("welcome").textContent="Welcome "+(role==="admin"?"Shuaibu Idi":(member.name||user.email));
$("roleTag").textContent="Role: "+(role==="admin"?"Business Owner":role==="worker"?"Shop Manager":role);
renderNav();
go("dashboard");

let collections=[
"stock","spareParts","transactions","spareSales","jobs",
"services","customers","suppliers","purchases","expenses",
"cashbook","invoices"
];

// All active members use the same business inventory and records.
    // Access is controlled by Firestore Security Rules, not by client-side filters.
    for(let c of collections){
      listen(c);
    }

    if(isAdmin()){
      listen("members");
      // Run at most one successful automatic backup per local calendar day.
      // A failed or cancelled attempt remains eligible for retry next time the app opens.
      maybeRunDailyAutoBackup();
    }
}catch(e){
say("Account setup error: "+e.message);
}
}

async function refreshData(){
if(!user)return;
await startData();
say("Business records refreshed.");
}

auth.onAuthStateChanged(async u=>{
user=u;
if(!u){
clearListeners();
member=null;
role=null;
$("login").classList.remove("hidden");
$("app").classList.add("hidden");
$("logoutBtn").classList.add("hidden");
return;
}
await startData();
});

window.addEventListener("beforeunload",clearListeners);

<style>
:root{font-family:Arial,sans-serif;color:#edf6ff;background:#071a2c}
*{box-sizing:border-box}body{margin:0;padding:12px}button,input,select,textarea{font:inherit}
.wrap{max-width:1100px;margin:auto}.card{background:#102b43;border:1px solid #294c66;border-radius:14px;padding:15px;margin:12px 0}

label{display:block;margin:9px 0 5px;color:#b9cee0;font-size:13px}
input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #3a5d77;background:#071a2c;color:white;font-size:16px}
textarea{min-height:75px}button{border:0;border-radius:8px;padding:11px 14px;background:#1686d9;color:white;font-weight:bold;margin:4px 3px 4px 0}
button.secondary{background:#31516b}button.danger{background:#a93636}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hidden{display:none!important}

.item{padding:13px;margin:9px 0;border:1px solid #31516b;border-radius:12px;background:linear-gradient(135deg,#102b43,#0b2237);line-height:1.6;box-shadow:0 3px 10px #0002}
.item strong,.item b{color:#fff}.item .muted{display:block;margin-top:3px}
.stat{font-size:22px;font-weight:bold}.small{font-size:12px;color:#a9bfd1}#msg,#status{white-space:pre-wrap;color:#ffd18b}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #31516b;vertical-align:top}
.actions{display:flex;gap:4px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}
.service-catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}
.service-chip{background:#0a2033;border:1px solid #365a75;border-radius:10px;padding:10px;color:#dceeff;font-size:13px}
@media print{body{background:white;color:black}.no-print,#appHeader,#nav{display:none!important}.card{background:white;color:black;border:0}input,select,textarea{border:0;color:black}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

</head>
<body><div class="wrap">
<header id="appHeader" class="row"><div><h1>S I A BUSINESS</h1>
<div class="muted">S I A TECH PRINT MEDIA · HOME OF PRINTING & COMPUTING</div>
<div class="muted">Matindi Trading Centre, Blantyre · Malawi</div>
<div class="muted">0999 290 495 · 0888 290 495</div></div>

</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAf8Sg2eDDQtKTXPT913E32IUUdLvIde-I",authDomain:"smart-business-manager-f319f.firebaseapp.com",projectId:"smart-business-manager-f319f",storageBucket:"smart-business-manager-f319f.firebasestorage.app",messagingSenderId:"716400037263",appId:"1:716400037263:web:42a1e961b1597d0d280ffa"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),BUSINESS_ID="7RqIYO3IDSVCYex1LsDo6rDw5V33";
const COLLECTIONS=["stock","spareParts","transactions","spareSales","jobs","services","customers","suppliers","purchases","expenses","cashbook","invoices"];
let user=null,member=null,role=null,current="dashboard",cache={},unsubs=[];
const $=id=>document.getElementById(id),path=c=>`businesses/${BUSINESS_ID}/${c}`,isAdmin=()=>role==="admin",money=n=>"MK "+Number(n||0).toLocaleString("en-MW",{maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),stamp=()=>firebase.firestore.FieldValue.serverTimestamp(),val=id=>$(id)?.value?.trim()||"",num=id=>Number($(id)?.value||0),records=c=>cache[c]||[];
function invoiceRecorder(){return isAdmin()?"Managing Director":(String(member?.name||user?.email||"Worker").trim())}
function say(t){$("status").textContent=t||""}function safeId(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||("item-"+Date.now())}
function dateText(v){try{return v?.toDate?v.toDate().toLocaleString():v?new Date(v).toLocaleString():""}catch(e){return ""}}
function navItems(){let a=[["dashboard","Dashboard"],["stock","Stock"],["spares","Spare parts"],["sales","Sales"],["jobs","Repairs / Jobs"],["services","Printing Services"],["customers","Customers"],["invoices","Invoices"]];if(isAdmin())a.push(["purchases","Purchases"],["suppliers","Suppliers"],["expenses","Expenses"],["cashbook","Cashbook"],["reports","Reports"],["settings","Settings"]);return a}
function renderNav(){$("nav").innerHTML=navItems().map(([id,label])=>`<button class="${current===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("")}
function go(id){current=id;renderNav();renderScreen();say("")}
function formField(id,label,type="text",placeholder="",step=""){return `<div><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" ${step?`step="${step}"`:""}></div>`}
function selectField(id,label,opts){return `<div><label>${label}</label><select id="${id}">${opts}</select></div>`}
async function addDoc(c,data){return db.collection(path(c)).add({...data,createdAt:stamp(),createdBy:user.uid})}
async function updateDoc(c,id,data){return db.doc(`${path(c)}/${id}`).update({...data,updatedAt:stamp(),updatedBy:user.uid})}
async function removeDoc(c,id){if(!isAdmin())return alert("Admin permission required.");if(!confirm("Delete this record permanently?"))return;try{await db.doc(`${path(c)}/${id}`).delete();say("Record deleted.")}catch(e){alert("Delete failed: "+e.message)}}
function listHtml(c,render){return records(c).map(x=>`<div class="item">${render(x)}</div>`).join("")||`<p class="muted">No ${c} records yet.</p>`}
function adminDelete(c,x){return isAdmin()?`<div class="actions"><button class="danger" onclick="removeDoc('${c}','${x.id}')">Delete</button></div>`:""}
function renderScreen(){let s=$("screen");if(!s)return;let f={dashboard,stock:stockScreen,spares:spareScreen,sales:salesScreen,jobs:jobsScreen,services:servicesScreen,customers:customersScreen,invoices:invoicesScreen,purchases:purchasesScreen,suppliers:suppliersScreen,expenses:expensesScreen,cashbook:cashbookScreen,reports:reportsScreen,settings:settingsScreen};(f[current]||dashboard)(s)}
function dashboard(s){let tx=[...records("transactions"),...records("spareSales")],sales=tx.reduce((a,x)=>a+Number(x.total||0),0)+records("services").reduce((a,x)=>a+Number(x.amount||0),0),exp=records("expenses").reduce((a,x)=>a+Number(x.amount||0),0);s.innerHTML=`<div class="grid"><div class="card"><div class="muted">Sales / services</div><div class="stat">${money(isAdmin()?sales:tx.filter(x=>x.workerUid===user.uid).reduce((a,x)=>a+Number(x.total||0),0))}</div></div><div class="card"><div class="muted">Stock items</div><div class="stat">${records("stock").length}</div></div><div class="card"><div class="muted">Spare parts</div><div class="stat">${records("spareParts").length}</div></div><div class="card"><div class="muted">Repair jobs</div><div class="stat">${records("jobs").length}</div></div>${isAdmin()?`<div class="card"><div class="muted">Expenses</div><div class="stat">${money(exp)}</div></div><div class="card"><div class="muted">Estimated gross profit</div><div class="stat">${money(grossProfit())}</div></div>`:""}</div><div class="card"><h3>Welcome to S I A BUSINESS</h3><p class="muted">Manage stock, spare parts, sales, repairs and printing services from one place.</p></div>`}
function stockScreen(s){s.innerHTML=`${isAdmin()?`<div class="card"><h3>Stock management</h3><div class="grid">${formField("stName","Product name")}${formField("stQty","Quantity","number")}${formField("stBuy","Buying price (MK)","number","","0.01")}${formField("stSell","Selling price (MK)","number","","0.01")}</div><button onclick="saveStock()">Save stock item</button></div>`:""}<div class="card"><h3>Stock list</h3>${listHtml("stock",p=>`<b>📦 ${esc(p.name)}</b><br><span class="muted">Available quantity: ${p.quantity}</span><br><b>Selling price: ${money(p.sellingPrice)}</b>${isAdmin()?`<br>Buying: ${money(p.buyingPrice)} · Profit/unit: ${money(Number(p.sellingPrice)-Number(p.buyingPrice))}<div class="actions"><button onclick="editItem('stock','${p.id}')">Edit</button><button class="danger" onclick="removeDoc('stock','${p.id}')">Delete</button></div>`:""}`)}</div>`}
async function saveStock(){let name=val("stName"),quantity=num("stQty"),buyingPrice=num("stBuy"),sellingPrice=num("stSell");if(!name||!Number.isInteger(quantity)||quantity<0||buyingPrice<0||sellingPrice<0)return alert("Enter valid stock details.");try{await db.doc(`${path("stock")}/${safeId(name)}`).set({name,quantity,buyingPrice,sellingPrice,updatedAt:stamp(),updatedBy:user.uid},{merge:true});say("Stock item saved.");renderScreen()}catch(e){alert("Could not save stock: "+e.message)}}
async function editItem(c,id){if(!isAdmin())return alert("Admin only.");let x=records(c).find(v=>v.id===id);if(!x)return;let name=prompt("Name:",x.name);if(name===null)return;let q=Number(prompt("Quantity:",x.quantity)),b=Number(prompt("Buying price:",x.buyingPrice||0)),p=Number(prompt("Selling price:",x.sellingPrice||0));if(!name.trim()||!Number.isInteger(q)||q<0||!Number.isFinite(b)||b<0||!Number.isFinite(p)||p<0)return alert("Invalid details.");try{await updateDoc(c,id,{name:name.trim(),quantity:q,buyingPrice:b,sellingPrice:p});say("Item updated.");renderScreen()}catch(e){alert("Update failed: "+e.message)}}
function spareScreen(s){s.innerHTML=`${isAdmin()?`<div class="card"><h3>Spare parts management</h3><div class="grid">${formField("spName","Spare part name")}${formField("spQty","Quantity","number")}${formField("spBuy","Buying price (MK)","number","","0.01")}${formField("spSell","Selling price (MK)","number","","0.01")}</div><button onclick="saveSpare()">Save spare part</button></div>`:""}<div class="card"><h3>Spare parts list</h3>${listHtml("spareParts",p=>`<b>🔧 ${esc(p.name)}</b><br>Qty: ${p.quantity} · Selling: ${money(p.sellingPrice)}${isAdmin()?`<br>Buy: ${money(p.buyingPrice)} · Profit/unit: ${money(p.sellingPrice-p.buyingPrice)} · Potential profit: ${money((p.sellingPrice-p.buyingPrice)*p.quantity)}<div class="actions"><button onclick="editItem('spareParts','${p.id}')">Edit</button><button class="danger" onclick="removeDoc('spareParts','${p.id}')">Delete</button></div>`:""}`)}</div>`}
async function saveSpare(){let name=val("spName"),quantity=num("spQty"),buyingPrice=num("spBuy"),sellingPrice=num("spSell");if(!name||!Number.isInteger(quantity)||quantity<0||buyingPrice<0||sellingPrice<0)return alert("Enter valid spare part details.");try{await db.doc(`${path("spareParts")}/${safeId(name)}`).set({name,quantity,buyingPrice,sellingPrice,updatedAt:stamp(),updatedBy:user.uid},{merge:true});say("Spare part saved.");renderScreen()}catch(e){alert("Could not save spare part: "+e.message)}}
function salesScreen(s){let so=records("stock").map(x=>`<option value="${x.id}">${esc(x.name)} (${x.quantity} available)</option>`).join(""),po=records("spareParts").map(x=>`<option value="${x.id}">${esc(x.name)} (${x.quantity} available)</option>`).join("");s.innerHTML=`<div class="card"><h3>Record stock sale</h3><div class="grid">${selectField("saleStock","Stock item",so)}${formField("saleQty","Quantity","number")}${formField("saleCustomer","Customer name")}${formField("salePhone","Customer phone")}${formField("salePaid","Amount paid (MK)","number","","0.01")}</div><button onclick="sellItem('stock')">Record stock sale</button></div><div class="card"><h3>Record spare part sale</h3><div class="grid">${selectField("saleSpare","Spare part",po)}${formField("spareQtySale","Quantity","number")}${formField("spareCustomer","Customer name")}${formField("sparePhone","Customer phone")}${formField("sparePaid","Amount paid (MK)","number","","0.01")}</div><button onclick="sellItem('spareParts')">Record spare part sale</button></div><div class="card"><h3>Sales history</h3><h3>Stock sales</h3>${listHtml("transactions",x=>`<b>🧾 ${esc(x.itemName)}</b> × ${x.quantity} = <b>${money(x.total)}</b><br><span class="muted">${esc(x.customerName||"Walk-in")} · ${esc(x.workerName||"")} · ${dateText(x.createdAt)}</span>${isAdmin()?`<br>Profit: ${money(x.profit||0)}${adminDelete("transactions",x)}`:""}`)}<h3>Spare part sales</h3>${listHtml("spareSales",x=>`<b>🧾 ${esc(x.itemName)}</b> × ${x.quantity} = <b>${money(x.total)}</b><br><span class="muted">${esc(x.customerName||"Walk-in")} · ${esc(x.workerName||"")} · ${dateText(x.createdAt)}</span>${isAdmin()?`<br>Profit: ${money(x.profit||0)}${adminDelete("spareSales",x)}`:""}`)}</div>`}
async function sellItem(kind){let spare=kind==="spareParts",id=val(spare?"saleSpare":"saleStock"),qty=num(spare?"spareQtySale":"saleQty"),item=records(kind).find(x=>x.id===id);if(!item||!Number.isInteger(qty)||qty<1)return alert("Choose an item and enter a valid quantity.");let col=spare?"spareSales":"transactions",ref=db.doc(`${path(kind)}/${id}`),tx=db.collection(path(col)).doc(),customerName=val(spare?"spareCustomer":"saleCustomer")||"Walk-in",phone=val(spare?"sparePhone":"salePhone"),paidRaw=val(spare?"sparePaid":"salePaid"),paid=paidRaw===""?null:Number(paidRaw);try{let saleData;await db.runTransaction(async t=>{let snap=await t.get(ref);if(!snap.exists||Number(snap.data().quantity)<qty)throw Error("Not enough stock available.");let d=snap.data(),total=qty*Number(d.sellingPrice||0),cost=qty*Number(d.buyingPrice||0);saleData={invoiceNo:"SIA-"+Date.now().toString().slice(-8),customerName,phone,description:`${d.name} × ${qty}`,quantity:qty,unitPrice:Number(d.sellingPrice||0),total,paid:paid===null?total:paid,balance:total-(paid===null?total:paid),sourceType:spare?"spare_sale":"sale",sourceId:tx.id,recordedBy:invoiceRecorder(),recordedByUid:user.uid};t.update(ref,{quantity:Number(d.quantity)-qty,lastSaleTxId:tx.id,updatedAt:stamp(),updatedBy:user.uid});t.set(tx,{itemId:id,itemName:d.name,quantity:qty,unitPrice:Number(d.sellingPrice||0),unitCost:Number(d.buyingPrice||0),total,cost,profit:total-cost,customerName,customerPhone:phone,workerUid:user.uid,workerName:member.name||user.email,type:spare?"spare_sale":"sale",createdAt:stamp()})});let invRef=await addDoc("invoices",saleData);saleData.id=invRef.id;saleData.createdAt=new Date();say("Sale recorded, stock updated and invoice generated.");showInvoice(saleData);renderScreen()}catch(e){alert("Sale failed: "+e.message)}}
function jobsScreen(s){s.innerHTML=`<div class="card"><h3>New repair / technician job</h3><div class="grid">${formField("jobCustomer","Customer name")}${formField("jobPhone","Customer phone")}${formField("jobDevice","Device / item")}${formField("jobIssue","Problem / work required")}${formField("jobFee","Service charge (MK)","number","","0.01")}${formField("jobParts","Parts cost (MK)","number","","0.01")}${formField("jobPaid","Amount paid (MK)","number","","0.01")}</div><label>Job notes</label><textarea id="jobNotes"></textarea><button onclick="saveJob()">Save job & invoice</button></div><div class="card"><h3>Repair jobs</h3>${listHtml("jobs",j=>`<b>🛠️ ${esc(j.device)}</b> · ${esc(j.customerName)}<br>${esc(j.issue)}<br>Charge: ${money(j.fee)} · Parts: ${money(j.partsCost)} · Status: <b>${esc(j.status)}</b><br><span class="muted">Technician: ${esc(j.workerName||"")}</span><div class="actions"><button onclick="changeJob('${j.id}')">Update status</button>${adminDelete("jobs",j)}</div>`)}</div>`}
async function saveJob(){let d={customerName:val("jobCustomer"),customerPhone:val("jobPhone"),device:val("jobDevice"),issue:val("jobIssue"),fee:num("jobFee"),partsCost:num("jobParts"),notes:val("jobNotes"),status:"Received",workerUid:user.uid,workerName:member.name||user.email};if(!d.customerName||!d.device||!d.issue||d.fee<0||d.partsCost<0)return alert("Complete the job details.");try{let j=await addDoc("jobs",d);let inv={invoiceNo:"SIA-"+Date.now().toString().slice(-8),customerName:d.customerName,phone:d.customerPhone,description:`Repair: ${d.device} — ${d.issue}`,quantity:1,unitPrice:d.fee,total:d.fee,paid:val("jobPaid")===""?d.fee:num("jobPaid"),balance:d.fee-(val("jobPaid")===""?d.fee:num("jobPaid")),sourceType:"repair",sourceId:j.id,recordedBy:invoiceRecorder(),recordedByUid:user.uid};let ir=await addDoc("invoices",inv);inv.id=ir.id;inv.createdAt=new Date();say("Repair job saved and invoice generated.");showInvoice(inv);renderScreen()}catch(e){alert("Job save failed: "+e.message)}}
async function changeJob(id){let j=records("jobs").find(x=>x.id===id);if(!j)return;let status=prompt("Enter status: Received, Diagnosing, Waiting for parts, In progress, Completed, Collected",j.status);if(!status)return;try{await updateDoc("jobs",id,{status});say("Job status updated.");renderScreen()}catch(e){alert("Status update failed: "+e.message)}}
const PRINT_SERVICES=["Black & white printing","Colour printing","Photocopying","Scanning","Lamination","Binding","Typing & document formatting","CV preparation","Application / cover letter","Passport-size photos","Graphic design","Business cards","Flyers & brochures","Posters","Banners","Booklets","Receipt / invoice printing","Other printing service"];
function servicesScreen(s){s.innerHTML=`<div class="card"><h3>🖨️ Printing Services</h3><p class="muted">Choose a printing service, enter customer details, quantity/pages, charge and direct cost. An invoice is generated automatically.</p><div class="grid">${formField("svcCustomer","Customer name")}${formField("svcPhone","Customer phone")}${selectField("svcType","Service category",PRINT_SERVICES.map(x=>`<option>${esc(x)}</option>`).join(""))}${formField("svcDesc","Details (paper size, colour, pages, etc.)")}${formField("svcQty","Quantity / pages","number")}${formField("svcPrice","Amount charged (MK)","number","","0.01")}${formField("svcCost","Direct cost (MK)","number","","0.01")}${formField("svcPaid","Amount paid (MK)","number","","0.01")}</div><button onclick="saveService()">Save service & generate invoice</button></div><div class="card"><h3>📚 Recorded services</h3>${listHtml("services",x=>`<b>🧾 ${esc(x.serviceType)}</b> · ${esc(x.customerName)}<br>${esc(x.description)} · Qty ${x.quantity}<br><b>Charged: ${money(x.amount)}</b> · Cost: ${money(x.cost)} · Profit: ${money(x.amount-x.cost)}<br><span class="muted">${dateText(x.createdAt)} · ${esc(x.workerName||"")}</span>${adminDelete("services",x)}`)}</div>`}
async function saveService(){let d={customerName:val("svcCustomer"),phone:val("svcPhone"),serviceType:val("svcType"),description:val("svcDesc"),quantity:num("svcQty"),amount:num("svcPrice"),cost:num("svcCost"),workerUid:user.uid,workerName:member.name||user.email};if(!d.customerName||!d.description||d.amount<0||d.cost<0||d.quantity<0)return alert("Enter valid service details.");try{let sr=await addDoc("services",d);let inv={invoiceNo:"SIA-"+Date.now().toString().slice(-8),customerName:d.customerName,phone:d.phone,description:`${d.serviceType}: ${d.description}`,quantity:d.quantity||1,unitPrice:d.amount,total:d.amount,paid:val("svcPaid")===""?d.amount:num("svcPaid"),balance:d.amount-(val("svcPaid")===""?d.amount:num("svcPaid")),sourceType:"service",sourceId:sr.id,recordedBy:invoiceRecorder(),recordedByUid:user.uid};let ir=await addDoc("invoices",inv);inv.id=ir.id;inv.createdAt=new Date();say("Service saved and invoice generated.");showInvoice(inv);renderScreen()}catch(e){alert("Service save failed: "+e.message)}}
function customersScreen(s){s.innerHTML=`<div class="card"><h3>Add customer</h3><div class="grid">${formField("cuName","Customer name")}${formField("cuPhone","Phone")}${formField("cuEmail","Email")}</div><button onclick="saveSimple('customers',{name:val('cuName'),phone:val('cuPhone'),email:val('cuEmail')})">Save customer</button></div><div class="card"><h3>Customers</h3>${listHtml("customers",x=>`<b>👤 ${esc(x.name)}</b><br>${esc(x.phone)} · ${esc(x.email)}${adminDelete("customers",x)}`)}</div>`}
function suppliersScreen(s){s.innerHTML=`<div class="card"><h3>Add supplier</h3><div class="grid">${formField("suName","Supplier name")}${formField("suPhone","Phone")}${formField("suEmail","Email")}</div><button onclick="saveSimple('suppliers',{name:val('suName'),phone:val('suPhone'),email:val('suEmail')})">Save supplier</button></div><div class="card"><h3>Suppliers</h3>${listHtml("suppliers",x=>`<b>${esc(x.name)}</b><br>${esc(x.phone)} · ${esc(x.email)}${adminDelete("suppliers",x)}`)}</div>`}
async function saveSimple(c,d){if(!d.name)return alert("Enter a name.");try{await addDoc(c,d);say("Saved.");renderScreen()}catch(e){alert("Save failed: "+e.message)}}
function purchasesScreen(s){let so=records("stock").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(""),po=records("spareParts").map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");s.innerHTML=`<div class="card"><h3>Record stock purchase</h3><div class="grid">${selectField("purStock","Stock item",so)}${formField("purQty","Quantity purchased","number")}${formField("purCost","Buying price per item (MK)","number","","0.01")}${formField("purSupplier","Supplier")}</div><button onclick="purchase('stock')">Save stock purchase</button></div><div class="card"><h3>Record spare parts purchase</h3><div class="grid">${selectField("purSpare","Spare part",po)}${formField("purSpQty","Quantity purchased","number")}${formField("purSpCost","Buying price per item (MK)","number","","0.01")}${formField("purSpSupplier","Supplier")}</div><button onclick="purchase('spareParts')">Save spare parts purchase</button></div><div class="card"><h3>Purchase history</h3>${listHtml("purchases",p=>`<b>${esc(p.itemName)}</b> × ${p.quantity} · ${money(p.totalCost)}<br><span class="muted">${esc(p.supplier||"")} · ${dateText(p.createdAt)}</span>${adminDelete("purchases",p)}`)}</div>`}
async function purchase(c){let spare=c==="spareParts",id=val(spare?"purSpare":"purStock"),qty=num(spare?"purSpQty":"purQty"),cost=num(spare?"purSpCost":"purCost"),supplier=val(spare?"purSpSupplier":"purSupplier"),item=records(c).find(x=>x.id===id);if(!item||!Number.isInteger(qty)||qty<1||cost<0)return alert("Enter valid purchase details.");let ref=db.doc(`${path(c)}/${id}`),pRef=db.collection(path("purchases")).doc();try{await db.runTransaction(async t=>{let snap=await t.get(ref);if(!snap.exists)throw Error("Item not found.");t.update(ref,{quantity:Number(snap.data().quantity||0)+qty,buyingPrice:cost,updatedAt:stamp(),updatedBy:user.uid});t.set(pRef,{itemId:id,itemName:item.name,category:c,quantity:qty,unitCost:cost,totalCost:qty*cost,supplier,createdAt:stamp(),createdBy:user.uid})});say("Purchase saved and stock increased.");renderScreen()}catch(e){alert("Purchase failed: "+e.message)}}
function expensesScreen(s){s.innerHTML=`<div class="card"><h3>Record business expense</h3><div class="grid">${formField("exTitle","Expense description")}${formField("exAmount","Amount (MK)","number","","0.01")}${selectField("exCategory","Category",'<option>Rent</option><option>Electricity</option><option>Transport</option><option>Wages</option><option>Internet</option><option>Supplies</option><option>Other</option>')}</div><button onclick="saveExpense()">Save expense</button></div><div class="card"><h3>Expenses history</h3>${listHtml("expenses",x=>`<b>${esc(x.title)}</b> · ${money(x.amount)}<br><span class="muted">${esc(x.category)} · ${dateText(x.createdAt)}</span>${adminDelete("expenses",x)}`)}</div>`}
async function saveExpense(){let title=val("exTitle"),amount=num("exAmount"),category=val("exCategory");if(!title||amount<=0)return alert("Enter expense details.");try{await addDoc("expenses",{title,amount,category});say("Expense saved.");renderScreen()}catch(e){alert("Expense save failed: "+e.message)}}
function cashbookScreen(s){s.innerHTML=`<div class="card"><h3>Cashbook entry</h3><div class="grid">${selectField("cashType","Entry type",'<option value="income">Money in</option><option value="expense">Money out</option>')}${formField("cashDesc","Description")}${formField("cashAmount","Amount (MK)","number","","0.01")}</div><button onclick="saveCash()">Save cashbook entry</button></div><div class="card"><h3>Cashbook history</h3>${listHtml("cashbook",x=>`<b>${esc(x.description)}</b> · ${x.type==="income"?"+":"-"}${money(x.amount)}<br><span class="muted">${dateText(x.createdAt)}</span>${adminDelete("cashbook",x)}`)}</div>`}
async function saveCash(){let description=val("cashDesc"),amount=num("cashAmount"),type=val("cashType");if(!description||amount<=0)return alert("Enter valid entry.");try{await addDoc("cashbook",{description,amount,type});say("Cashbook entry saved.");renderScreen()}catch(e){alert("Cashbook save failed: "+e.message)}}
function invoicesScreen(s){s.innerHTML=`<div class="card"><h3>🧾 Invoice register</h3><p class="muted">Invoices are created automatically when you record a sale, repair job or service. This page is only for viewing and printing invoices.</p>${listHtml("invoices",x=>`<div class="row"><div><b>${esc(x.invoiceNo)}</b><br>${esc(x.customerName)} · ${money(x.total)}<br><span class="muted">${esc(x.description||"")} · ${dateText(x.createdAt)}<br>Recorded by: ${esc(x.recordedBy||"Not available (older invoice)")}</span></div><div class="actions"><button onclick="printInvoice('${x.id}')">View / Print</button>${adminDelete("invoices",x)}</div></div>`)}</div>`}
function invoiceMarkup(x){return `<div style="font-family:Arial;color:#111;max-width:760px;margin:20px auto;padding:28px;border:1px solid #ddd"><h1 style="text-align:center;margin-bottom:6px">S I A TECH PRINT MEDIA</h1><p style="text-align:center">HOME OF PRINTING & COMPUTING<br>Matindi Trading Centre, Blantyre · Malawi<br>0999 290 495 · 0888 290 495</p><hr><h2>INVOICE / RECEIPT</h2><p><b>Invoice:</b> ${esc(x.invoiceNo)}<br><b>Date:</b> ${esc(dateText(x.createdAt)||new Date().toLocaleString())}<br><b>Customer:</b> ${esc(x.customerName)}<br><b>Phone:</b> ${esc(x.phone||"")}<br><b>Recorded by:</b> ${esc(x.recordedBy||"Not available (older invoice)")}</p><table style="width:100%;border-collapse:collapse"><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Total</th></tr><tr><td>${esc(x.description)}</td><td>${x.quantity}</td><td>${money(x.unitPrice)}</td><td>${money(x.total)}</td></tr></table><h2 style="text-align:right">Total: ${money(x.total)}</h2><p style="text-align:right">Paid: ${money(x.paid)}<br>Balance: ${money(x.balance)}</p><p>Thank you for doing business with us.</p></div>`}
async function createInvoice(){return alert("Invoices are generated automatically from Sales, Repairs/Jobs and Printing Services.")}
function showInvoice(x){let w=window.open("","_blank");if(!w){alert("Allow pop-ups for this site, then tap View / Print on the saved invoice.");return}w.document.open();w.document.write(`<!doctype html><html><head><title>${esc(x.invoiceNo)}</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;margin:0;padding:15px}table th,table td{border:1px solid #ccc;padding:9px;text-align:left}@media print{button{display:none}}</style></head><body>${invoiceMarkup(x)}<div style="text-align:center"><button onclick="window.print()">Print invoice</button></div></body></html>`);w.document.close()}
function printInvoice(id){let x=records("invoices").find(v=>v.id===id);if(!x)return alert("Invoice is still loading. Please try again in a moment.");showInvoice(x)}
function reportsScreen(s){let tx=[...records("transactions"),...records("spareSales")],services=records("services"),ex=records("expenses").reduce((a,x)=>a+Number(x.amount||0),0),sales=tx.reduce((a,x)=>a+Number(x.total||0),0)+services.reduce((a,x)=>a+Number(x.amount||0),0),profit=grossProfit();s.innerHTML=`<div class="grid"><div class="card"><div class="muted">Recorded sales / services</div><div class="stat">${money(sales)}</div></div><div class="card"><div class="muted">Estimated gross profit</div><div class="stat">${money(profit)}</div></div><div class="card"><div class="muted">Expenses</div><div class="stat">${money(ex)}</div></div><div class="card"><div class="muted">Profit after expenses</div><div class="stat">${money(profit-ex)}</div></div><div class="card"><div class="muted">Purchases recorded</div><div class="stat">${money(records("purchases").reduce((a,x)=>a+Number(x.totalCost||0),0))}</div></div></div><div class="card"><h3>Report note</h3><p class="muted">Profit is an estimate based on saved buying costs and service costs.</p><button onclick="exportBackup()">Download business backup</button></div>`}
function grossProfit(){return [...records("transactions"),...records("spareSales")].reduce((a,x)=>a+Number(x.profit||0),0)+records("services").reduce((a,x)=>a+Number(x.amount||0)-Number(x.cost||0),0)+records("jobs").reduce((a,x)=>a+Number(x.fee||0)-Number(x.partsCost||0),0)}
function settingsScreen(s){s.innerHTML=`<div class="card"><h3>Business settings</h3><p class="muted">S I A BUSINESS · S I A TECH PRINT MEDIA<br>Matindi Trading Centre, Blantyre · Malawi<br>Only the Admin account can manage business-wide records.</p><button onclick="exportBackup()">Download full backup (JSON)</button><label>Restore backup file</label><input type="file" id="restoreFile" accept=".json,application/json"><button onclick="restoreBackup()">Restore backup</button><p class="muted">Restore adds or updates records from the backup. Download a fresh backup before restoring.</p><hr><h3>Danger zone</h3><p class="muted">This permanently deletes all records in the business collections listed below.</p><button class="danger" onclick="deleteAllBusinessRecords()">Delete ALL business records</button></div>`}
function encodeBackup(v){if(v&&typeof v.toDate==="function"){let d=v.toDate();return {__siaType:"timestamp",seconds:Math.floor(d.getTime()/1000),nanoseconds:(d.getTime()%1000)*1000000}}if(Array.isArray(v))return v.map(encodeBackup);if(v&&typeof v==="object"){let o={};for(let k of Object.keys(v))o[k]=encodeBackup(v[k]);return o}return v}
function decodeBackup(v){if(Array.isArray(v))return v.map(decodeBackup);if(v&&typeof v==="object"){if(v.__siaType==="timestamp"&&Number.isFinite(v.seconds))return new firebase.firestore.Timestamp(v.seconds,Number(v.nanoseconds||0));let o={};for(let k of Object.keys(v))o[k]=decodeBackup(v[k]);return o}return v}
async function exportBackup(){if(!isAdmin())return alert("Admin only.");try{let out={business:"S I A BUSINESS",formatVersion:2,exportedAt:new Date().toISOString(),businessId:BUSINESS_ID,data:{}};for(let c of COLLECTIONS){let snap=await db.collection(path(c)).get();out.data[c]=snap.docs.map(d=>({id:d.id,...encodeBackup(d.data())}))}let blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="sia-business-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);say("Backup downloaded successfully.")}catch(e){alert("Backup failed: "+e.message)}}
async function restoreBackup(){if(!isAdmin())return alert("Admin only.");let file=$("restoreFile")?.files?.[0];if(!file)return alert("Choose a backup file.");if(!confirm("Restore records from this backup? Existing records with matching IDs will be overwritten."))return;try{let b=JSON.parse(await file.text());if(!b.data||typeof b.data!=="object")throw Error("This is not a valid S I A BUSINESS backup.");if(b.businessId&&b.businessId!==BUSINESS_ID)throw Error("This backup belongs to a different business account.");for(let c of COLLECTIONS){let arr=b.data[c]||[];for(let i=0;i<arr.length;i+=400){let batch=db.batch();for(let x of arr.slice(i,i+400)){let {id,...raw}=x;if(!id)continue;batch.set(db.doc(`${path(c)}/${id}`),decodeBackup(raw),{merge:true})}await batch.commit()}}alert("Backup restored successfully.");say("Backup restored. Data is syncing.")}catch(e){alert("Restore failed: "+e.message)}}
async function deleteAllBusinessRecords(){if(!isAdmin())return alert("Admin only.");let phrase=prompt('This will permanently delete all business records. Type DELETE ALL to continue:');if(phrase!=="DELETE ALL")return alert("Cancelled. Nothing was deleted.");if(!confirm("Final confirmation: delete every record in all business collections?"))return;try{for(let c of COLLECTIONS){let snap=await db.collection(path(c)).get();for(let i=0;i<snap.docs.length;i+=400){let batch=db.batch();snap.docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));await batch.commit()}}alert("All business records have been deleted. Staff accounts and member permissions remain.");say("All business records deleted.")}catch(e){alert("Delete-all stopped: "+e.message+" Some records may already have been deleted.")}}
async function register(){try{let email=$("email").value.trim(),pass=$("password").value;if(!email||pass.length<8)throw Error("Enter email and password (minimum 8 characters).");let cred=await auth.createUserWithEmailAndPassword(email,pass);$("msg").textContent="Account created. Ask Admin to add UID "+cred.user.uid+" to businesses/"+BUSINESS_ID+"/members with role=worker and active=true."}catch(e){$("msg").textContent=e.message}}
async function login(){try{$("msg").textContent="Signing in…";await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("msg").textContent=e.message}}
async function logout(){unsubs.forEach(f=>f());unsubs=[];cache={};await auth.signOut()}
auth.onAuthStateChanged(async u=>{user=u;if(!u){unsubs.forEach(f=>f());unsubs=[];cache={};$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logoutBtn").classList.add("hidden");return}try{let snap=await db.doc(`${path("members")}/${u.uid}`).get();if(!snap.exists||snap.data().active!==true){await auth.signOut();$("msg").textContent="This account is not authorized. Contact the Admin.";return}member=snap.data();role=member.role;if(!["admin","worker"].includes(role))throw Error("Invalid account role.");$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");$("welcome").textContent=isAdmin()?"Welcome, The Manager":"Welcome, "+(member.name||u.email);$("roleTag").textContent=role.toUpperCase()+" · "+u.email;current="dashboard";startData();renderNav();renderScreen()}catch(e){await auth.signOut();$("msg").textContent=e.message}});
function startData(){unsubs.forEach(f=>f());unsubs=[];cache={};const listen=(c,query=null)=>{let ref=db.collection(path(c));if(query)ref=query(ref);unsubs.push(ref.onSnapshot(s=>{cache[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(c==="transactions"||c==="spareSales"){let total=records("transactions").reduce((a,x)=>a+Number(x.total||0),0)+records("spareSales").reduce((a,x)=>a+Number(x.total||0),0);if(isAdmin())$("salesTotal").textContent=money(total)}if(["dashboard","reports","sales","invoices","jobs","services","stock","spares","customers","purchases","suppliers","expenses","cashbook"].includes(current))renderScreen()},e=>say(c+" loading error: "+e.message)))};["stock","spareParts","customers"].forEach(c=>listen(c));if(isAdmin()){["transactions","spareSales","jobs","services","suppliers","purchases","expenses","cashbook","invoices"].forEach(c=>listen(c))}else{listen("transactions",r=>r.where("workerUid","==",user.uid));listen("spareSales",r=>r.where("workerUid","==",user.uid));listen("jobs",r=>r.where("workerUid","==",user.uid));listen("services",r=>r.where("workerUid","==",user.uid));listen("invoices",r=>r.where("createdBy","==",user.uid))}}
</script></body></html>

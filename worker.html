<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b0e"><title>SIA Worker Portal</title><style>
:root{font-family:Arial,sans-serif;color:#f4f5f7;background:#080b0e}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:850px;margin:auto}.card{background:#111519;border:1px solid #29323a;border-radius:18px;padding:17px;margin:14px 0}h1,h2,h3{margin:5px 0 12px}p,.muted{color:#aeb8c2;line-height:1.5}label{display:block;margin:10px 0 5px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #343e48;background:#171d23;color:white;font-size:16px}button{border:0;border-radius:20px;padding:11px 16px;margin:5px 4px 5px 0;background:#ffd33d;color:#17130a;font-weight:bold}.secondary{background:#29323a;color:white}.item{padding:13px;border:1px solid #29323a;border-radius:13px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none!important}#msg{white-space:pre-wrap;color:#ffd36b}.price{font-weight:bold;color:#ffd36b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script></head><body>
<header><h1>S I A TECH PRINT MEDIA</h1><p>Worker Portal · Stock movements and selling prices</p></header>
<section id="login" class="card"><h2>Worker sign in</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="signIn()">Sign in</button><div id="msg"></div></section>
<main id="app" class="hidden"><section class="card"><div class="row"><div><h2 id="hello">Worker</h2><p>Only selling prices and operational stock are shown here.</p></div><button class="secondary" onclick="logout()">Sign out</button></div></section>
<section class="card"><h3>Record stock in / stock out</h3><label>Product</label><select id="item"></select><div class="grid"><div><label>Movement</label><select id="direction"><option value="out">Stock out</option><option value="in">Stock in</option></select></div><div><label>Quantity</label><input id="qty" type="number" min="1" step="1"></div></div><label>Reason / reference (optional)</label><input id="reason" maxlength="120" placeholder="Sale, return, received stock..."><button onclick="recordMovement()">Save movement</button><div id="movementMsg"></div></section>
<section class="card"><h3>Available stock</h3><div id="stockList">Loading...</div></section>
<section class="card"><h3>Recent movements</h3><div id="history">Loading...</div></section></main>
<script>
const cfg={apiKey:"AIzaSyAf8Sg2eDDQtKXPT913E32IUUdLvIde-I",authDomain:"smart-business-manager-f319f.firebaseapp.com",projectId:"smart-business-manager-f319f",storageBucket:"smart-business-manager-f319f.firebasestorage.app",messagingSenderId:"716400037263",appId:"1:716400037263:web:42a1e961b1597d0d280ffa"};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),B="7RqIYO3IDSVCYex1LsDo6rDw5V33",p=c=>"businesses/"+B+"/"+c,$=id=>document.getElementById(id);let currentUser=null,member=null,items=[],unsubs=[];
const $=id=>document.getElementById(id);const money=n=>"MK "+Number(n||0).toLocaleString("en-MW",{maximumFractionDigits:2}),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function signIn(){try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value)}catch(e){$("msg").textContent=e.message}}
async function logout(){await auth.signOut()}
function listen(){unsubs.forEach(f=>f());unsubs=[];unsubs.push(db.collection(p("workerStock")).where("active","==",true).onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));renderStock()},e=>$("movementMsg").textContent="Stock access: "+e.message));unsubs.push(db.collection(p("stockMovements")).where("workerUid","==",currentUser.uid).limit(30).onSnapshot(s=>{$("history").innerHTML=s.docs.map(d=>{let x=d.data();return '<div class="item"><b>'+esc(x.itemName)+'</b> · '+x.direction.toUpperCase()+' '+x.quantity+'<br><span class="muted">'+esc(x.reason||"")+' · '+(x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():"Just recorded")+'</span></div>'}).join("")||"No movements recorded yet."},e=>$("history").textContent=e.message))}
function renderStock(){let active=items.filter(x=>x.active!==false);$("item").innerHTML=active.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' — '+money(x.sellingPrice)+'</option>').join("");$("stockList").innerHTML=active.map(x=>'<div class="item"><div class="row"><b>'+esc(x.name)+'</b><span class="price">'+money(x.sellingPrice)+'</span></div><div class="muted">Available quantity: <b>'+Number(x.quantity||0)+'</b></div></div>').join("")||"No products have been published by Admin yet."}
async function recordMovement(){let id=$("item").value,qty=Number($("qty").value),direction=$("direction").value,item=items.find(x=>x.id===id);if(!item||!Number.isInteger(qty)||qty<1){$("movementMsg").textContent="Choose a product and enter a whole quantity greater than zero.";return}if(direction==="out"&&qty>Number(item.quantity||0)){ $("movementMsg").textContent="Not enough stock available.";return}const movement=db.collection(p("stockMovements")).doc(),stock=db.doc(p("workerStock")+"/"+id),newQty=Number(item.quantity||0)+(direction==="in"?qty:-qty),batch=db.batch();batch.update(stock,{quantity:newQty,lastMovementId:movement.id,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});batch.set(movement,{itemId:id,itemName:item.name,direction,quantity:qty,reason:$("reason").value.trim(),workerUid:currentUser.uid,workerName:member.name||currentUser.email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});try{await batch.commit();$("qty").value="";$("reason").value="";$("movementMsg").textContent="Stock movement saved. Available quantity updated."; }catch(e){$("movementMsg").textContent="Could not save movement: "+e.message}}
auth.onAuthStateChanged(async u=>{currentUser=u;if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");unsubs.forEach(f=>f());return}try{let s=await db.doc(p("members")+"/"+u.uid).get();if(!s.exists||s.data().active!==true||s.data().role!=="worker"){await auth.signOut();$("msg").textContent="This account is not an active Worker account. Contact Admin.";return}member=s.data();$("hello").textContent="Welcome, "+(member.name||u.email);$("login").classList.add("hidden");$("app").classList.remove("hidden");listen()}catch(e){$("msg").textContent="Account check failed: "+e.message}});
</script></body></html>

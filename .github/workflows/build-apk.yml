name: Build SIA Business Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'logo.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Android project
        run: |
          set -euo pipefail

          mkdir app-build
          cd app-build

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install --save-dev @capacitor/assets sharp

          mkdir -p www resources
          cp ../index.html www/index.html
          cp ../logo.png resources/icon.png

          npx cap init "SIA Business Manager" "com.siatech.businessmanager" --web-dir=www
          npx cap add android

      - name: Generate Android app icons
        run: |
          set -euo pipefail
          cd app-build
          npx capacitor-assets generate --android

      - name: Configure permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: One or more signing secrets are missing"
            exit 1
          fi

          mkdir -p app-build/android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/keystore.b64

          if ! base64 --decode /tmp/keystore.b64 > app-build/android/app/sia-business-release.jks; then
            echo "ERROR: Invalid Base64 keystore secret. Please check the GitHub secret."
            exit 1
          fi

          if [ ! -s app-build/android/app/sia-business-release.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

          cat >> app-build/android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("sia-business-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Fix Kotlin dependencies
        run: |
          set -euo pipefail
          cd app-build

          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency {
                      if (requested.group == 'org.jetbrains.kotlin') {
                          useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Business-Manager-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

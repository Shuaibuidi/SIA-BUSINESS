name: Build SIA BUSINESS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'logo.png'
      - 'icon.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Android project
        run: |
          set -euo pipefail

          mkdir app-build
          cd app-build

          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npm install @aparajita/capacitor-biometric-auth@^9.1.2
          npm install @capgo/capacitor-printer@^7
          npm install @capgo/capacitor-social-login@^7
          npm install --save-dev @capacitor/assets sharp esbuild

          mkdir -p www resources
          cp ../index.html www/index.html
          cp ../logo.png www/logo.png
          cp ../icon.png resources/icon.png

          # Bundle the native biometric plugin for this app's plain HTML interface.
          cat > biometric-auth.js <<'EOF'
          import { BiometricAuth, AndroidBiometryStrength } from '@aparajita/capacitor-biometric-auth';

          window.SIABiometric = {
            checkBiometry: () => BiometricAuth.checkBiometry(),
            authenticate: () => BiometricAuth.authenticate({
              reason: 'Unlock Smart Business Manager',
              cancelTitle: 'Use app PIN',
              allowDeviceCredential: false,
              androidTitle: 'Fingerprint authentication',
              androidSubtitle: 'Verify your fingerprint to open your business records',
              androidConfirmationRequired: false,
              androidBiometryStrength: AndroidBiometryStrength.strong
            })
          };
          EOF
          npx esbuild biometric-auth.js --bundle --platform=browser --format=iife --outfile=www/biometric-auth.js

          # Bundle native Android/iOS printing support for invoice HTML.
          cat > printer.js <<'EOF'
          import { Printer } from '@capgo/capacitor-printer';

          window.SIAPrinter = {
            printHtml: (html) => Printer.printHtml({ html })
          };
          EOF
          npx esbuild printer.js --bundle --platform=browser --format=iife --outfile=www/printer.js

          # Bundle native Google sign-in with the Google Drive file scope.
          cat > social-login.js <<'EOF'
          import { SocialLogin } from '@capgo/capacitor-social-login';

          let googleInitPromise;
          async function initializeGoogle() {
            if (!googleInitPromise) {
              googleInitPromise = SocialLogin.initialize({
                google: {
                  webClientId: '716400037263-5f89dmj3bacm7b7ksfi9u6buc3d0ssml.apps.googleusercontent.com',
                  mode: 'online'
                }
              });
            }
            return googleInitPromise;
          }

          window.SIAGoogleDriveAuth = {
            getAccessToken: async () => {
              await initializeGoogle();
              const response = await SocialLogin.login({
                provider: 'google',
                options: {
                  scopes: ['https://www.googleapis.com/auth/drive.file']
                }
              });
              const accessToken = response?.result?.accessToken;
              const token = typeof accessToken === 'string' ? accessToken : accessToken?.token;
              if (!token || typeof token !== 'string') throw new Error('Google did not return a valid Drive access token. Please connect again.');
              return token;
            }
          };
          EOF
          npx esbuild social-login.js --bundle --platform=browser --format=iife --outfile=www/social-login.js

          npx cap init "SIA BUSINESS" "com.siatech.businessmanager" --web-dir=www
          npx cap add android

          # Forward Google Drive authorization results to the native sign-in plugin.
          mkdir -p android/app/src/main/java/com/siatech/businessmanager
          cat > android/app/src/main/java/com/siatech/businessmanager/MainActivity.java <<'EOF'
          package com.siatech.businessmanager;

          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN
                          && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                      if (pluginHandle == null) {
                          Log.i("Google Activity Result", "SocialLogin plugin handle is null");
                          return;
                      }
                      Plugin plugin = pluginHandle.getInstance();
                      if (!(plugin instanceof SocialLoginPlugin)) {
                          Log.i("Google Activity Result", "SocialLogin plugin instance is invalid");
                          return;
                      }
                      ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF

          npx cap sync android

      - name: Set Android application name
        run: |
          set -euo pipefail
          cd app-build

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "ERROR: Android strings.xml not found"
            exit 1
          fi

          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">SIA BUSINESS</string>#' "$STRINGS_FILE"

          grep "app_name" "$STRINGS_FILE"

      - name: Generate Android app icons
        run: |
          set -euo pipefail
          cd app-build
          npx capacitor-assets generate --android

      - name: Configure permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: One or more signing secrets are missing"
            exit 1
          fi

          mkdir -p app-build/android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' > /tmp/keystore.b64

          if ! base64 --decode /tmp/keystore.b64 > app-build/android/app/sia-business-release.jks; then
            echo "ERROR: Invalid Base64 keystore secret. Please check the GitHub secret."
            exit 1
          fi

          if [ ! -s app-build/android/app/sia-business-release.jks ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

          echo "Signing certificate SHA-1 fingerprint:"
          keytool -list -v -keystore app-build/android/app/sia-business-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" | grep -i "SHA1:"

          cat >> app-build/android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("sia-business-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Fix Kotlin dependencies
        run: |
          set -euo pipefail
          cd app-build

          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency {
                      if (requested.group == 'org.jetbrains.kotlin') {
                          useVersion '1.8.22'
                      }
                      if (requested.group == 'androidx.browser' && requested.name == 'browser') {
                          useVersion '1.8.0'
                      }
                  }
              }
          }
          EOF

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SIA-BUSINESS-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

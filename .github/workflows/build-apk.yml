name: Generate SIA Business Signing Key

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent signing key
        run: |
          keytool -genkeypair -v \
            -keystore sia-business-release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'SiaBusiness2026!' }}" \
            -alias siabusiness \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'SiaBusiness2026!' }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SIA BUSINESS,O=SIA TECH PRINT MEDIA,C=MW"

      - name: Show SHA1 fingerprint
        run: |
          keytool -list -v \
            -keystore sia-business-release.jks \
            -storepass "SiaBusiness2026!" \
            -alias siabusiness

      - name: Encode signing key
        run: |
          base64 -w 0 sia-business-release.jks > signing-key.txt

      - name: Upload signing key artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIA-Business-Signing-Key
          path: signing-key.txt
          retention-days: 1

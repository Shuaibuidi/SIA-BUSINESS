<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071a2c"><title>S I A BUSINESS Manager</title>
<style>
:root{--bg:#071a2c;--panel:#102b43;--panel2:#153852;--text:#eaf3fb;--muted:#a9bfd1;--blue:#1686d9;--red:#b83f4d;--green:#1e9b72;--line:#294c66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#061525;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}header h1{font-size:17px;margin:0}header small{color:var(--muted)}main{max-width:1000px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;padding:8px 0 12px}.nav button{white-space:nowrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{font-size:24px;font-weight:bold;margin-top:8px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #3a5d77;background:#071a2c;color:white;font-size:16px}button{border:0;border-radius:9px;padding:11px 13px;background:var(--blue);color:white;font-weight:bold;margin:3px;cursor:pointer}button.secondary{background:#31516b}button.danger{background:var(--red)}button.green{background:var(--green)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.item{padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#0b2236}.item b{display:block;margin-bottom:4px}.notice{background:#142f45;padding:10px;border-radius:8px;color:#d5e7f5;font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.dangerText{color:#ff9ba4}#login{max-width:420px;margin:8vh auto;padding:18px}.brand{color:#6cc2ff}footer{text-align:center;color:#718ba0;font-size:12px;padding:20px}
</style></head>
<body>
<header><div><h1>💼 S I A BUSINESS</h1><small>S I A TECH PRINT MEDIA · Business Manager</small></div><div id="userBadge" class="muted">Not signed in</div></header>
<div id="login" class="card">
<h2>Welcome back</h2><p class="muted">Choose your role and enter your PIN.</p>
<label>Role</label><select id="loginRole"><option value="admin">Admin / Owner</option><option value="worker">Worker</option></select>
<label>PIN</label><input id="loginPin" type="password" inputmode="numeric" placeholder="Enter PIN">
<button class="green" style="width:100%;margin-top:12px" onclick="login()">Unlock app</button>
<p class="muted">Default Admin PIN: <b>1234</b> · Change it in Settings.</p>
</div>
<div id="app" class="hidden"><main>
<div class="nav" id="nav"></div>
<div id="view"></div>
</main></div>
<footer>S I A BUSINESS · S I A TECH PRINT MEDIA · Offline prototype saves on this device. Export backups regularly.</footer>
<script>
const KEY='sia_business_manager_new_v1';
const fresh={settings:{business:'S I A TECH PRINT MEDIA',tagline:'HOME OF PRINTING & COMPUTING',address:'Matindi Trading Centre, Blantyre',phone:'0888 290 495',currency:'MK',adminPin:'1234',workerPin:'2222'},stock:[],sales:[],services:[],expenses:[],workers:[],customers:[]};
let db=load(),role='',page='Dashboard';
function load(){try{return {...fresh,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(fresh)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return (db.settings.currency||'MK')+' '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){let r=document.getElementById('loginRole').value,p=document.getElementById('loginPin').value;let expected=r==='admin'?db.settings.adminPin:db.settings.workerPin;if(p!==expected){alert('Incorrect PIN');return}role=r;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userBadge').textContent=r==='admin'?'👑 Admin':'👷 Worker';buildNav();show('Dashboard')}
function logout(){role='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginPin').value=''}
const adminPages=['Dashboard','Stock','Sales','Services','Customers','Expenses','Workers','Invoices','Settings','Backup'];
const workerPages=['Dashboard','New Sale','New Service','My Records','Stock'];
function buildNav(){document.getElementById('nav').innerHTML=[...(role==='admin'?adminPages:workerPages)].map(p=>`<button class="${p===page?'green':'secondary'}" onclick="show('${p}')">${p}</button>`).join('')+`<button class="danger" onclick="logout()">Lock</button>`}
function show(p){page=p;buildNav();let v=document.getElementById('view');if(role==='worker'&&['Expenses','Workers','Settings','Backup','Invoices','Customers','Sales'].includes(p)){p='Dashboard';page=p;buildNav()}
let body='';
if(p==='Dashboard'){let revenue=db.sales.reduce((a,x)=>a+x.total,0)+db.services.reduce((a,x)=>a+x.total,0),expenses=db.expenses.reduce((a,x)=>a+x.amount,0);body=`<h2>Dashboard</h2><div class="grid"><div class="card">Sales & Services<div class="stat">${money(revenue)}</div></div><div class="card">Stock items<div class="stat">${db.stock.length}</div></div><div class="card">Transactions<div class="stat">${db.sales.length+db.services.length}</div></div>${role==='admin'?`<div class="card">Expenses<div class="stat">${money(expenses)}</div></div><div class="card">Estimated profit<div class="stat">${money(revenue-expenses)}</div><small class="muted">Before cost of goods/service materials.</small></div>`:''}</div><div class="notice">Welcome to ${esc(db.settings.business)}. ${role==='admin'?'You have owner access on this device.':'Record sales and services. Admin-only records are hidden.'}</div>`}
if(p==='Stock')body=stockPage();
if(p==='Sales')body=`<h2>Sales history</h2>${list(db.sales,x=>`${esc(x.item)} · ${x.qty} × ${money(x.price)} = <b>${money(x.total)}</b><small class="muted"> · ${esc(x.date)} · ${esc(x.worker||'')}</small>`,true)}`;
if(p==='New Sale')body=saleForm();
if(p==='Services'||p==='New Service')body=serviceForm();
if(p==='My Records')body=`<h2>My records</h2>${list([...db.sales,...db.services].filter(x=>x.worker=== 'Worker').sort((a,b)=>b.created-a),x=>`${esc(x.item)} · ${money(x.total)} <small class="muted">${esc(x.date)}</small>`)}`;
if(p==='Expenses')body=expensePage();
if(p==='Workers')body=workersPage();
if(p==='Customers')body=customersPage();
if(p==='Invoices')body=`<h2>Invoice / Receipt</h2><p class="muted">Choose a recent transaction to print a receipt.</p>${list([...db.sales,...db.services].slice().reverse(),x=>`<b>${esc(x.item)}</b> · ${money(x.total)} <button onclick="printReceipt('${x.id}')">Print</button>`)}`;
if(p==='Settings')body=settingsPage();
if(p==='Backup')body=`<h2>Backup & Restore</h2><button onclick="backup()">Download backup JSON</button><label>Restore backup</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="muted">Restore replaces current data. Make a backup first.</p>`;
v.innerHTML=body}
function list(arr,fn){return arr.length?arr.map(x=>`<div class="item">${fn(x)}${role==='admin'?`<button class="danger" onclick="delRecord('${x.id}')">Delete</button>`:''}</div>`).join(''):'<p class="muted">No records yet.</p>'}
function stockPage(){return `<h2>Stock & Spare Parts</h2>${role==='admin'?`<div class="card"><h3>Add / update stock</h3><label>Item name</label><input id="stName"><label>Quantity</label><input id="stQty" type="number" min="0"><label>Retail price</label><input id="stPrice" type="number" min="0"><label>Cost price (Admin only)</label><input id="stCost" type="number" min="0"><button onclick="addStock()">Save stock</button></div>`:''}<h3>Stock available</h3>${db.stock.map(x=>`<div class="item"><b>${esc(x.name)}</b>${x.qty} available · ${money(x.price)}${role==='admin'?`<small class="muted"> · Cost: ${money(x.cost)}</small><button class="danger" onclick="removeStock('${x.id}')">Delete</button>`:''}</div>`).join('')||'<p class="muted">No stock recorded.</p>'}`}
function addStock(){let name=document.getElementById('stName').value.trim(),qty=Number(document.getElementById('stQty').value),price=Number(document.getElementById('stPrice').value),cost=Number(document.getElementById('stCost').value);if(!name||qty<0||price<0){alert('Enter valid stock details');return}let found=db.stock.find(x=>x.name.toLowerCase()===name.toLowerCase());if(found){found.qty+=qty;found.price=price;found.cost=cost}else db.stock.push({id:uid(),name,qty,price,cost});save();show('Stock')}
function removeStock(id){if(confirm('Delete stock item?')){db.stock=db.stock.filter(x=>x.id!==id);save();show('Stock')}}
function saleForm(){return `<h2>Record sale</h2><div class="card"><label>Stock item</label><select id="saleItem">${db.stock.filter(x=>x.qty>0).map(x=>`<option value="${x.id}">${esc(x.name)} (${x.qty})</option>`).join('')}</select><label>Quantity</label><input id="saleQty" type="number" value="1" min="1"><label>Selling price each</label><input id="salePrice" type="number" min="0"><label>Customer name</label><input id="saleCustomer" placeholder="Walk-in customer"><label>Phone</label><input id="salePhone"><button class="green" onclick="recordSale()">Save sale</button></div>`}
function recordSale(){let item=db.stock.find(x=>x.id===document.getElementById('saleItem').value),qty=Number(document.getElementById('saleQty').value),price=Number(document.getElementById('salePrice').value);if(!item||qty<1||qty>item.qty||price<0){alert('Check item, quantity and price');return}item.qty-=qty;let rec={id:uid(),item:item.name,qty,price,total:qty*price,customer:document.getElementById('saleCustomer').value||'Walk-in',phone:document.getElementById('salePhone').value,date:new Date().toLocaleString(),created:Date.now(),worker:role==='admin'?'Admin':'Worker'};db.sales.push(rec);save();alert('Sale saved. Total '+money(rec.total));show(role==='admin'?'Sales':'My Records')}
function serviceForm(){return `<h2>Printing / Repair / Service</h2><div class="card"><label>Service type</label><select id="svcType"><option>Printing</option><option>Photocopy</option><option>Computer repair</option><option>Phone repair</option><option>Typing</option><option>Other service</option></select><label>Description</label><input id="svcName" placeholder="e.g. A4 colour printing / laptop repair"><label>Quantity / pages</label><input id="svcQty" type="number" value="1" min="1"><label>Price per unit</label><input id="svcPrice" type="number" min="0"><label>Customer</label><input id="svcCustomer" placeholder="Walk-in"><label>Phone</label><input id="svcPhone"><button class="green" onclick="recordService()">Save service</button></div>${role==='admin'?`<h3>Service history</h3>${list(db.services,x=>`${esc(x.item)} · ${money(x.total)} · ${esc(x.date)}`,true)}`:''}`}
function recordService(){let desc=document.getElementById('svcName').value.trim(),qty=Number(document.getElementById('svcQty').value),price=Number(document.getElementById('svcPrice').value);if(!desc||qty<1||price<0){alert('Enter service details');return}let rec={id:uid(),item:document.getElementById('svcType').value+' — '+desc,qty,price,total:qty*price,customer:document.getElementById('svcCustomer').value||'Walk-in',phone:document.getElementById('svcPhone').value,date:new Date().toLocaleString(),created:Date.now(),worker:role==='admin'?'Admin':'Worker'};db.services.push(rec);save();alert('Service saved: '+money(rec.total));show(role==='admin'?'Services':'My Records')}
function expensePage(){return `<h2>Expenses (Admin)</h2><div class="card"><label>Expense description</label><input id="expName"><label>Amount</label><input id="expAmount" type="number" min="0"><button onclick="addExpense()">Save expense</button></div>${list(db.expenses,x=>`${esc(x.item)} · ${money(x.amount)} <small class="muted">${esc(x.date)}</small>`)}`}
function addExpense(){let item=document.getElementById('expName').value.trim(),amount=Number(document.getElementById('expAmount').value);if(!item||amount<=0){alert('Enter expense details');return}db.expenses.push({id:uid(),item,amount,date:new Date().toLocaleString()});save();show('Expenses')}
function workersPage(){return `<h2>Workers</h2><div class="card"><label>Worker name</label><input id="workerName"><label>Phone / contact</label><input id="workerPhone"><label>Worker PIN (4–8 digits)</label><input id="workerPin" type="password"><button onclick="addWorker()">Add worker (this device)</button><p class="muted">Worker accounts are local-device PIN profiles in this prototype.</p></div>${db.workers.map(w=>`<div class="item">${esc(w.name)} · ${esc(w.phone)} <button class="danger" onclick="deleteWorker('${w.id}')">Remove</button></div>`).join('')}`}
function addWorker(){let name=document.getElementById('workerName').value.trim(),pin=document.getElementById('workerPin').value;if(!name||!/^\d{4,8}$/.test(pin)){alert('Name and 4–8 digit PIN required');return}db.workers.push({id:uid(),name,phone:document.getElementById('workerPhone').value,pin});db.settings.workerPin=pin;save();show('Workers')}
function deleteWorker(id){db.workers=db.workers.filter(w=>w.id!==id);save();show('Workers')}
function customersPage(){return `<h2>Customers</h2><div class="card"><label>Name</label><input id="custName"><label>Phone</label><input id="custPhone"><label>Address</label><input id="custAddress"><button onclick="addCustomer()">Save customer</button></div>${db.customers.map(c=>`<div class="item">${esc(c.name)} · ${esc(c.phone)} · ${esc(c.address)}</div>`).join('')}`}
function addCustomer(){let name=document.getElementById('custName').value.trim();if(!name)return alert('Name required');db.customers.push({id:uid(),name,phone:document.getElementById('custPhone').value,address:document.getElementById('custAddress').value});save();show('Customers')}
function settingsPage(){return `<h2>Business Settings</h2><div class="card"><label>Business name</label><input id="setBusiness" value="${esc(db.settings.business)}"><label>Tagline</label><input id="setTag" value="${esc(db.settings.tagline)}"><label>Address</label><input id="setAddress" value="${esc(db.settings.address)}"><label>Phone</label><input id="setPhone" value="${esc(db.settings.phone)}"><label>Currency</label><input id="setCurrency" value="${esc(db.settings.currency)}"><label>New Admin PIN</label><input id="setPin" type="password" placeholder="Leave blank to keep current"><button onclick="saveSettings()">Save settings</button></div>`}
function saveSettings(){['business','tagline','address','phone','currency'].forEach(k=>db.settings[k]=document.getElementById('set'+k[0].toUpperCase()+k.slice(1)).value);let pin=document.getElementById('setPin').value;if(pin){if(!/^\d{4,8}$/.test(pin))return alert('PIN must be 4–8 digits');db.settings.adminPin=pin}save();alert('Settings saved');show('Settings')}
function delRecord(id){if(!confirm('Delete this record?'))return;['sales','services','expenses'].forEach(k=>db[k]=db[k].filter(x=>x.id!==id));save();show(page)}
function printReceipt(id){let x=[...db.sales,...db.services].find(a=>a.id===id);if(!x)return;let w=window.open('','_blank');if(!w)return alert('Allow popups to print');w.document.write(`<html><body style="font-family:Arial;padding:25px"><h2>${esc(db.settings.business)}</h2><p>${esc(db.settings.address)} · ${esc(db.settings.phone)}</p><h3>RECEIPT</h3><p>${esc(x.date)}<br>Customer: ${esc(x.customer||'')}</p><hr>${esc(x.item)} × ${x.qty} @ ${money(x.price)}<h2>Total: ${money(x.total)}</h2><p>Thank you for your business.</p><button onclick="print()">Print</button></body></html>`);w.document.close()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SIA_BUSINESS_backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.stock))throw Error('Invalid backup');if(confirm('Replace all app data with backup?')){db={...fresh,...x};save();show(page);alert('Backup restored')}}catch(err){alert('Could not restore: '+err.message)}};r.readAsText(f)}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
</script></body></html>
